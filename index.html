/* =========================================================================
   v1.5.0 — SHINE LAYER: rotating light rings, sweeping sheen, breathing glow
   ========================================================================= */
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes angSpin{to{--ang:360deg}}

/* ---------- hero: rotating light ring around the card ---------- */
.hero{
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.026) 0 1px, transparent 1px 7px),
    radial-gradient(120% 130% at 88% -10%, rgba(67,183,255,.26), transparent 55%),
    radial-gradient(90% 100% at 0% 110%, rgba(155,112,232,.22), transparent 60%),
    linear-gradient(160deg,#1a2740,#101827 60%,#0b1220);
}
.hero::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:5;
  background:conic-gradient(from var(--ang),
    transparent 0deg 28deg,
    rgba(67,183,255,.9) 68deg,
    rgba(216,177,92,.95) 112deg,
    rgba(67,183,255,0) 168deg 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:angSpin 7.5s linear infinite;
}

/* ---------- avatar: slow halo ring ---------- */
.avatar-wrap::before{
  content:"";position:absolute;inset:-7px;border-radius:26px;padding:1px;pointer-events:none;z-index:0;
  background:conic-gradient(from var(--ang),
    transparent 0deg 40deg,
    rgba(67,183,255,.85) 90deg,
    rgba(216,177,92,.75) 140deg,
    transparent 195deg 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:angSpin 10s linear infinite;
}

/* ---------- panels: periodic sheen sweep ---------- */
.panel::after{
  background:
    linear-gradient(112deg, transparent 42%, rgba(255,255,255,.085) 49%, rgba(255,255,255,.015) 54%, transparent 62%) -160% 0/260% 100% no-repeat,
    linear-gradient(180deg, rgba(255,255,255,.06), transparent 30%);
  animation:panelSweep 12s ease-in-out infinite;
}
@keyframes panelSweep{
  0%,60%{background-position:-160% 0, 0 0}
  92%,100%{background-position:260% 0, 0 0}
}

/* ---------- primary / gold buttons: light pass ---------- */
.btn.primary::after, .btn.gold::after{
  background:linear-gradient(108deg, transparent 34%, rgba(255,255,255,.6) 50%, transparent 66%) -130% 0/220% 100% no-repeat;
  animation:btnSweep 4.8s ease-in-out infinite;
}
@keyframes btnSweep{
  0%,58%{background-position:-130% 0}
  90%,100%{background-position:230% 0}
}
.btn.primary:hover::after, .btn.gold:hover::after{animation-duration:2.2s}

/* ---------- wordmark ---------- */
.brand-name{
  background:linear-gradient(100deg,#dfeaf7 18%,#8fd0ff 36%,#ffffff 46%,#8fd0ff 56%,#dfeaf7 74%) 0 0/260% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:brandShine 7s linear infinite;
}
@keyframes brandShine{to{background-position:260% 0}}

/* ---------- XP bar: travelling highlight ---------- */
.bar.xp > i{position:relative;overflow:hidden}
.bar.xp > i::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg, transparent 28%, rgba(255,255,255,.65) 50%, transparent 72%) -100% 0/200% 100% no-repeat;
  animation:barShine 3.4s linear infinite;
}
@keyframes barShine{to{background-position:200% 0}}

/* ---------- level seal ---------- */
.avatar .lvl-badge{overflow:hidden}
.avatar .lvl-badge::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(108deg, transparent 30%, rgba(255,255,255,.8) 50%, transparent 70%) -130% 0/220% 100% no-repeat;
  animation:btnSweep 5.5s ease-in-out infinite;
}

/* ---------- ready chest: breathing gold ---------- */
.chest-panel.ready{
  border-color:rgba(216,177,92,.8);
  animation:chestGlow 2.9s ease-in-out infinite;
}
@keyframes chestGlow{
  0%,100%{box-shadow:0 0 24px -18px rgba(216,177,92,.9), inset 0 0 30px -24px rgba(216,177,92,.9)}
  50%{box-shadow:0 0 46px -10px rgba(216,177,92,1), inset 0 0 44px -18px rgba(216,177,92,1)}
}

/* ---------- nav glow ---------- */
.bn-item.active svg{animation:navPulse 3.4s ease-in-out infinite}
@keyframes navPulse{
  0%,100%{filter:drop-shadow(0 0 5px rgba(67,183,255,.55))}
  50%{filter:drop-shadow(0 0 13px rgba(67,183,255,1))}
}
.side-item.active{animation:sidePulse 4.6s ease-in-out infinite}
@keyframes sidePulse{
  0%,100%{box-shadow:inset 3px 0 0 var(--blue), inset 0 0 26px -16px rgba(67,183,255,.8)}
  50%{box-shadow:inset 3px 0 0 var(--blue), inset 0 0 40px -10px rgba(67,183,255,1), 0 0 20px -14px rgba(67,183,255,.9)}
}

/* ---------- tier orbs ---------- */
.tier-node.available .tier-orb{
  animation:orbFloat 4s ease-in-out infinite, orbGlow 3.2s ease-in-out infinite;
}
@keyframes orbGlow{
  0%,100%{box-shadow:0 0 0 4px rgba(67,183,255,.12), 0 0 22px -8px rgba(67,183,255,.85)}
  50%{box-shadow:0 0 0 7px rgba(67,183,255,.2), 0 0 34px -4px rgba(67,183,255,1)}
}

/* ---------- modal top light ---------- */
.modal::before{
  content:"";position:absolute;top:0;left:14%;right:14%;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(150,225,255,.95),transparent);
  animation:edgeGlow 4.2s ease-in-out infinite;
}
@keyframes edgeGlow{0%,100%{opacity:.3}50%{opacity:1}}

/* ---------- unlocked skills breathe ---------- */
.skill-node.unlocked .sn-orb{animation:nodeGlow 4s ease-in-out infinite}
@keyframes nodeGlow{
  0%,100%{box-shadow:0 0 12px -6px rgba(85,214,154,.9)}
  50%{box-shadow:0 0 22px -4px rgba(85,214,154,1)}
}

/* ---------- boss sigil breathes by phase ---------- */
.boss-portrait{animation:sigilBreath 4.6s ease-in-out infinite}
@keyframes sigilBreath{
  0%,100%{box-shadow:0 0 0 1px rgba(229,72,72,.55), 0 0 0 5px rgba(9,11,16,.9), 0 0 0 6px rgba(229,72,72,.25), 0 0 36px -10px rgba(229,72,72,.9), inset 0 0 26px -10px #000}
  50%{box-shadow:0 0 0 1px rgba(255,120,120,.8), 0 0 0 5px rgba(9,11,16,.9), 0 0 0 7px rgba(229,72,72,.4), 0 0 58px -4px rgba(229,72,72,1), inset 0 0 26px -10px #000}
}

/* ---------- reduced motion / animations off ---------- */
body.no-anim .hero::before,body.no-anim .avatar-wrap::before,body.no-anim .panel::after,
body.no-anim .btn.primary::after,body.no-anim .btn.gold::after,body.no-anim .brand-name,
body.no-anim .bar.xp > i::after,body.no-anim .chest-panel.ready,body.no-anim .boss-portrait{
  animation:none!important;
}

/* parchment: keep gold text readable on cream */
body.theme-parchment .hero-title{color:#8a6a24}
body.theme-parchment .gold{color:#8a6a24}
body.theme-parchment .qc-purpose{color:#8a6a24}
body.theme-parchment .bar.xp > i::after{opacity:.5}
body.theme-parchment .panel::after{
  background:
    linear-gradient(112deg, transparent 42%, rgba(120,150,190,.16) 49%, rgba(120,150,190,.04) 54%, transparent 62%) -160% 0/260% 100% no-repeat,
    linear-gradient(180deg, rgba(255,255,255,.55), transparent 30%);
  animation:panelSweep 12s ease-in-out infinite;
}

/* ============ v1.6.0 — forge + pact ============ */
.forge-row{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:10px;border-radius:11px;border:1px solid var(--border);
  background:linear-gradient(160deg, rgba(255,255,255,.045), rgba(255,255,255,.012));
  margin-bottom:7px;
}
.forge-row .fr-main{min-width:0;flex:1}
.forge-row .fr-title{font-size:11.5px;font-weight:650;letter-spacing:.02em}
.forge-row .fr-meta{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.45}
.forge-row .btn{flex:0 0 auto}

.eq-slots{grid-template-columns:repeat(2,1fr)}
.eq-slot.locked{opacity:.6;border-style:dashed;border-color:rgba(229,72,72,.35)}

.pact-emblem{
  display:flex;align-items:center;gap:11px;padding:11px;border-radius:12px;
  border:1px solid var(--border);background:linear-gradient(150deg, rgba(216,177,92,.12), rgba(255,255,255,.02));
}
.pact-emblem .pe-ico{width:44px;height:44px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;
  color:var(--gold);background:rgba(216,177,92,.14);border:1px solid rgba(216,177,92,.35)}
.pact-emblem .pe-ico svg{width:22px;height:22px}
.pact-emblem .pe-name{font-size:13px;font-weight:650}
.pact-emblem .pe-meta{font-size:10px;margin-top:3px}
.pact-emblem.r-legendary{border-color:rgba(216,177,92,.5)}
.pact-emblem.r-transcendent{border-color:rgba(229,72,72,.55)}
.pact-emblem.r-epic{border-color:rgba(155,112,232,.4)}

.pact-ask{padding:10px;border-radius:11px;border:1px dashed rgba(216,177,92,.5);background:rgba(216,177,92,.07);margin-top:10px}

@media (min-width:620px){
  .eq-slots{grid-template-columns:repeat(4,1fr)}
}
body.theme-parchment .forge-row,
body.theme-parchment .pact-emblem{background:linear-gradient(160deg,#fffdf8,#f2eada);color:#1b2230}
body.theme-parchment .pact-ask{background:rgba(216,177,92,.12)}

/* ============ v1.7.0 — own music ============ */
.bgm-dock{
  position:fixed;z-index:70;left:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);
  display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;
  border:1px solid var(--edge-strong);
  background:linear-gradient(180deg, rgba(30,45,71,.96), rgba(17,26,41,.96));
  box-shadow:0 12px 26px -16px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(8px);max-width:190px;
}
.bgm-dock[hidden]{display:none}
.bgm-toggle{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
  border:1px solid rgba(67,183,255,.4);color:var(--blue);
  background:linear-gradient(180deg, rgba(67,183,255,.22), rgba(67,183,255,.06));
}
.bgm-toggle svg{width:14px;height:14px}
.bgm-dock.playing .bgm-toggle{box-shadow:0 0 16px -6px rgba(67,183,255,.95)}
.bgm-bars{display:flex;align-items:flex-end;gap:2px;height:14px;flex:0 0 auto}
.bgm-bars i{width:2px;height:4px;border-radius:1px;background:rgba(67,183,255,.55)}
.bgm-dock.playing .bgm-bars i{animation:bars 1.1s ease-in-out infinite;background:var(--blue)}
.bgm-dock.playing .bgm-bars i:nth-child(2){animation-delay:.18s}
.bgm-dock.playing .bgm-bars i:nth-child(3){animation-delay:.36s}
@keyframes bars{0%,100%{height:4px}50%{height:13px}}
.bgm-title{
  font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:96px;
}
.music-slot{
  display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;margin-top:10px;
  border:1px solid var(--border);background:linear-gradient(160deg, rgba(255,255,255,.05), rgba(255,255,255,.012));
}
.music-slot .ms-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
  color:var(--blue);background:rgba(67,183,255,.12);border:1px solid rgba(67,183,255,.3)}
.music-slot .ms-ico svg{width:19px;height:19px}
.music-slot .ms-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:6px;border-radius:4px;
  background:linear-gradient(90deg,#2b8fd6,#43B7FF) , rgba(255,255,255,.12);
  background-size:100% 100%;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6);
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:16px;height:16px;border-radius:50%;margin-top:-5px;
  background:linear-gradient(180deg,#eaf7ff,#8fd0ff);border:1px solid rgba(67,183,255,.8);
  box-shadow:0 0 12px -2px rgba(67,183,255,.9);
}
input[type="range"]::-moz-range-track{height:6px;border-radius:4px;background:rgba(255,255,255,.14)}
input[type="range"]::-moz-range-progress{height:6px;border-radius:4px;background:linear-gradient(90deg,#2b8fd6,#43B7FF)}
input[type="range"]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#8fd0ff;border:1px solid #43B7FF}
@media (min-width:1000px){
  .bgm-dock{left:254px;bottom:18px}
  .bgm-title{max-width:150px}
}
@media (max-width:400px){
  .bgm-title{display:none}
  .bgm-dock{padding:5px}
}
body.theme-parchment .bgm-dock{background:linear-gradient(180deg,#fffdf8,#f2eada);color:#1b2230}
body.theme-parchment .music-slot{background:linear-gradient(160deg,#fffdf8,#f2eada)}

@media (max-width:619px){
  .bgm-dock{width:46px;height:46px;padding:0;border-radius:50%;justify-content:center}
  .bgm-dock .bgm-bars,.bgm-dock .bgm-title{display:none}
  .bgm-toggle{width:36px;height:36px}
}

/* ============ v1.8.0 — ambient watch ============ */
.ambient-pill{
  position:fixed;z-index:112;left:12px;top:calc(var(--topbar-h) + var(--safe-t) + 8px);
  display:flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border-radius:999px;
  border:1px solid rgba(229,72,72,.45);
  background:linear-gradient(180deg, rgba(46,26,32,.96), rgba(20,14,20,.96));
  box-shadow:0 10px 24px -14px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,.06);
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#ffb3b3;
}
.ambient-pill[hidden]{display:none}
.ambient-pill .ap-dot{width:7px;height:7px;border-radius:50%;background:var(--crimson);box-shadow:0 0 10px var(--crimson);animation:apPulse 1.6s ease-in-out infinite}
@keyframes apPulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.ambient-pill .ap-time{color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.ambient-pill .ap-stop{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid var(--border)}
.ambient-pill .ap-stop svg{width:11px;height:11px}
.ambient-pill .ap-stop:hover{color:#fff;border-color:rgba(229,72,72,.6)}
body.ambient-on .topbar{border-bottom-color:rgba(229,72,72,.35)}

.ambient-panel{border-color:rgba(67,183,255,.28)}
.ambient-panel .bar{height:8px}
.ambient-panel .bar > i{transition:width .12s linear}
body.theme-parchment .ambient-pill{background:linear-gradient(180deg,#fff4f4,#f6e6e6);color:#a33030}

/* modal actions wrap properly with 3-4 choices */
.modal-actions{display:flex;flex-wrap:wrap;gap:8px}
.modal-actions .btn{
  flex:1 1 45%;min-width:132px;white-space:normal;text-align:center;
  line-height:1.3;padding:9px 10px;font-size:10.5px;letter-spacing:.08em;
}
.modal-actions .btn.wide{flex:1 1 100%}

/* ambient pill sits bottom-right, away from the hero */
.ambient-pill{top:auto;left:auto;right:12px;bottom:calc(var(--nav-h) + var(--safe-b) + 10px)}
@media (min-width:1000px){
  .ambient-pill{right:18px;bottom:18px}
}

.auth-err{min-height:16px;font-size:11px;color:#ff9d9d;margin:8px 0 2px;text-align:left}

.auth-note{font-size:10px;line-height:1.6;color:var(--muted);margin-top:14px}

.setup-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}

.setup-chips .chip.gold{color:#231a06;background:linear-gradient(180deg,#f0d38c,#c39b45);border-color:rgba(216,177,92,.8);font-weight:700}

  background:rgba(6,9,14,.55);color:var(--text);font-size:12.5px;

      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq = 440, dur = 0.09, type = 'sine', gain = 0.045) {
    const ctx = this.ensure();
    if (!ctx || !S.settings.sound) return;
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = 0;
    o.connect(g); g.connect(ctx.destination);
    const now = ctx.currentTime;
    g.gain.linearRampToValueAtTime(gain, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.start(now); o.stop(now + dur + 0.02);
  },
  click() { this.tone(320, 0.05, 'triangle', 0.03); },
  reward() { this.tone(660, 0.1, 'sine', 0.05); setTimeout(() => this.tone(880, 0.12, 'sine', 0.04), 90); },
  fail() { this.tone(180, 0.16, 'sawtooth', 0.035); },
  level() { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 0.18, 'sine', 0.05), i * 110)); }
};

/* ------------------------------------------------------------------ toast */
function toast(msg, kind = 'info', icon) {
  const stack = $('#toasts');
  if (!stack) return;
  const ic = icon || (kind === 'gold' ? ICO.star : kind === 'green' ? ICO.check : kind === 'red' ? ICO.skull : ICO.spark);
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'info' ? '' : kind);
  el.innerHTML = `<span class="t-ico">${ic}</span><span>${msg}</span>`;
  while (stack.children.length >= 3) stack.removeChild(stack.firstChild);
  stack.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 260);
  }, 3200);
}

/* ------------------------------------------------------------------ modal */
let modalStack = [];

function openModal(opts) {
  const root = $('#modalRoot');
  const cfg = Object.assign({ title: '', sub: '', body: '', actions: [], onMount: null, wide: false }, opts);
  const actionsHtml = cfg.actions.length
    ? `<div class="modal-actions">${cfg.actions.map((a, i) =>
        `<button class="btn ${a.cls || 'ghost'}" data-mact="${i}">${a.label}</button>`).join('')}</div>`
    : '';
  root.innerHTML = `
    <div class="modal-back" data-mback="1"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(cfg.title || 'Dialog')}">
      <div class="modal-grab"></div>
      <div class="modal-head">
        <div>
          <div class="modal-title">${cfg.title}</div>
          ${cfg.sub ? `<div class="small muted mt-s">${cfg.sub}</div>` : ''}
        </div>
        <button class="modal-close" data-mclose="1" aria-label="Close">${ICO.close}</button>
      </div>
      <div class="modal-body">${cfg.body}</div>
      ${actionsHtml}
    </div>`;
  root.hidden = false;
  document.body.style.overflow = 'hidden';
  modalStack.push(cfg);

  root.querySelector('[data-mback]').addEventListener('click', closeModal);
  root.querySelector('[data-mclose]').addEventListener('click', closeModal);
  $$('[data-mact]', root).forEach(btn => {
    btn.addEventListener('click', () => {
      const a = cfg.actions[Number(btn.dataset.mact)];
      if (a && typeof a.onClick === 'function') { a.onClick(); }
      else closeModal();
    });
  });
  if (typeof cfg.onMount === 'function') cfg.onMount(root.querySelector('.modal'), closeModal);
  const focusable = root.querySelector('.modal .btn, .modal input, .modal textarea, .modal select');
  if (focusable) focusable.focus({ preventScroll: true });
}
function closeModal() {
  const root = $('#modalRoot');
  if (!root || root.hidden) return;
  const cfg = modalStack[modalStack.length - 1];
  root.hidden = true;
  root.innerHTML = '';
  modalStack = [];
  document.body.style.overflow = '';
  if (cfg && typeof cfg.onDismiss === 'function') cfg.onDismiss();
}
function confirmDialog({ title, body, confirmLabel = 'Confirm', danger = true, onConfirm }) {
  openModal({
    title,
    body,
    actions: [
      { label: 'Cancel', cls: 'ghost', onClick: closeModal },
      {
        label: confirmLabel, cls: danger ? 'danger' : 'primary',
        onClick: () => { closeModal(); onConfirm(); }
      }
    ]
  });
}

/* ------------------------------------------------------------------ rewards */
function xpForNext(level) { return 100 + level * 50; }

function award(r, opts = {}) {
  const { xp = 0, coins = 0, crystals = 0, shadow = 0, transc = 0, energy = 0, item = null, silent = false } = r || {};
  if (xp) {
    S.player.xp += xp;
    S.stats.totalXp += xp;
    S.daily.xp += xp;
    S.activity[todayStr()] = (S.activity[todayStr()] || 0) + xp;
  }
  if (coins) { S.currencies.coins += coins; S.stats.coinsEarned += coins; S.daily.coins += coins; }
  if (crystals) S.currencies.crystals += crystals;
  if (shadow) S.currencies.shadow += shadow;
  if (transc) S.currencies.transcendent += transc;
  if (energy) S.currencies.focusEnergy = clamp(S.currencies.focusEnergy + energy);
  if (item) addItem(item.id || item, item.qty || 1);

  while (S.player.xp >= S.player.xpNext) {
    S.player.xp -= S.player.xpNext;
    S.player.level += 1;
    S.player.xpNext = xpForNext(S.player.level);
    S.player.skillPoints += 1;
    S.currencies.coins += 50;
    pendingLevels += 1;
  }
  if (!silent && (xp || coins || crystals)) {
    const bits = [];
    if (xp) bits.push(`+${xp} XP`);
    if (coins) bits.push(`+${coins} coins`);
    if (crystals) bits.push(`+${crystals} crystal`);
    if (shadow) bits.push(`+${shadow} shadow`);
    if (transc) bits.push(`+${transc} transcendent`);
    if (bits.length) toast(bits.join(' · '), 'gold', ICO.spark);
  }
  Sound.reward();
  save();
  if (pendingLevels > 0 && !opts.noLevel) showLevelUp();
  return true;
}

function addItem(id, qty = 1) {
  const found = S.inventory.find(i => i.id === id);
  if (found) found.qty += qty;
  else S.inventory.push({ id, qty, equipped: false });
  if (S.settings.notifItem) {
    const it = ITEMS.find(i => i.id === id);
    if (it) toast(`New item acquired — ${it.name}`, 'green', ICO.bag);
  }
  checkAchievements();
}

function removeItem(id, qty = 1) {
  const found = S.inventory.find(i => i.id === id);
  if (!found) return false;
  found.qty -= qty;
  if (found.qty <= 0) S.inventory = S.inventory.filter(i => i.id !== id);
  return true;
}
function ownedQty(id) {
  const f = S.inventory.find(i => i.id === id);
  return f ? f.qty : 0;
}

/* ------------------------------------------------------------------ boot */
/* ================================================================== ACCOUNTS
   Local only: a username and a password, hashed and kept in this browser.
   There is no server, so there is no email, no OTP and no password reset.
   ====================================================================== */
const ACC_KEY = 'wlgq.accounts';
const SESSION_KEY = 'wlgq.session';
let CURRENT_USER = null;
let AUTH_MODE = 'create';

function saveKey() { return CURRENT_USER ? 'wlgq.save.v1:u:' + CURRENT_USER : 'wlgq.save.v1'; }
function accounts() {
  try { return JSON.parse(localStorage.getItem(ACC_KEY) || '{}') || {}; } catch (e) { return {}; }
}
function writeAccounts(a) {
  try { localStorage.setItem(ACC_KEY, JSON.stringify(a)); } catch (e) {}
}
function randSalt() {
  const a = new Uint8Array(8);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a);
  else for (let i = 0; i < a.length; i++) a[i] = Math.floor(Math.random() * 256);
  return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPass(pass, salt) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pass));
    return 'sha256:' + Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381;
    const s = salt + ':' + pass;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'weak:' + Math.abs(h).toString(16);
  }
}

function bootAuth() {
  const accs = accounts();
  const session = localStorage.getItem(SESSION_KEY);
  if (session && accs[session]) {
    CURRENT_USER = session;
    startGame();
    return;
  }
  if (session) localStorage.removeItem(SESSION_KEY);
  showAuth('create');
}

function showAuth(mode) {
  AUTH_MODE = mode || 'create';
  let root = $('#authRoot');
  if (!root) {
    root = document.createElement('div');
    root.id = 'authRoot';
    root.className = 'auth';
    document.body.appendChild(root);
  }
  const accs = accounts();
  const names = Object.keys(accs);
  root.hidden = false;
  root.innerHTML = `
    <div class="auth-card">
      <div class="auth-mark">${ICO.lock}</div>
      <div class="auth-brand">WLGQ</div>
      <div class="auth-sub">WAR ON ADDICTION</div>
      <h1 class="auth-title">${AUTH_MODE === 'create' ? 'Open your record' : 'Sign back in'}</h1>
      <p class="auth-copy">${AUTH_MODE === 'create'
        ? 'A username and a password. That is the whole account — no email, no phone number, no verification.'
        : 'Enter the username and password for this record.'}</p>

      <div class="auth-tabs">
        <button class="auth-tab ${AUTH_MODE === 'create' ? 'on' : ''}" data-auth="create">CREATE</button>
        <button class="auth-tab ${AUTH_MODE === 'signin' ? 'on' : ''}" data-auth="signin">SIGN IN</button>
      </div>

      <label class="auth-label" for="auName">Username</label>
      <input class="auth-input" id="auName" autocomplete="username" maxlength="20" placeholder="sairaj">
      <label class="auth-label" for="auPass">Password</label>
      <input class="auth-input" id="auPass" type="password" autocomplete="current-password" placeholder="at least 6 characters">
      ${AUTH_MODE === 'create' ? `
        <label class="auth-label" for="auPass2">Repeat password</label>
        <input class="auth-input" id="auPass2" type="password" autocomplete="new-password" placeholder="same again">` : ''}

      <div class="auth-err" id="authErr"></div>
      <button class="btn primary wide auth-go" data-auth-go="1">${AUTH_MODE === 'create' ? 'CREATE ACCOUNT' : 'SIGN IN'}</button>

      <p class="auth-note">The account lives in this browser only. The password is hashed on this device, nothing is uploaded, and there is no reset — if you forget it, the record cannot be opened.</p>
      ${AUTH_MODE === 'signin' && names.length ? `<p class="auth-note muted">Records on this device: ${names.map(n => esc(n)).join(', ')}</p>` : ''}
      <button class="auth-guest" data-auth-guest="1">Continue without an account</button>
    </div>`;

  $$('[data-auth]', root).forEach(b => b.addEventListener('click', () => showAuth(b.dataset.auth)));
  const go = $('[data-auth-go]', root);
  if (go) go.addEventListener('click', submitAuth);
  const guest = $('[data-auth-guest]', root);
  if (guest) guest.addEventListener('click', () => {
    CURRENT_USER = null;
    localStorage.removeItem(SESSION_KEY);
    startGame();
  });
  const pass = $('#auPass', root);
  if (pass) pass.addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth(); });
  const name = $('#auName', root);
  if (name) name.focus({ preventScroll: true });
}

function authError(msg) {
  const el = $('#authErr');
  if (el) el.textContent = msg || '';
}

async function submitAuth() {
  const nameEl = $('#auName');
  const passEl = $('#auPass');
  const pass2El = $('#auPass2');
  const name = (nameEl ? nameEl.value : '').trim();
  const pass = passEl ? passEl.value : '';
  authError('');

  if (!/^[a-zA-Z0-9_]{3,20}$/.test(name)) { authError('Username: 3–20 letters, numbers or _'); return; }
  if (pass.length < 6) { authError('Password: at least 6 characters'); return; }

  const accs = accounts();
  if (AUTH_MODE === 'create') {
    if (accs[name]) { authError('That username already exists on this device.'); return; }
    if (pass2El && pass2El.value !== pass) { authError('The two passwords do not match.'); return; }
    const salt = randSalt();
    const hash = await hashPass(pass, salt);
    accs[name] = { salt, hash, created: Date.now(), last: Date.now() };
    writeAccounts(accs);
    CURRENT_USER = name;
    localStorage.setItem(SESSION_KEY, name);
    S = freshState();
    save();
    startGame();
    setTimeout(() => toast('Record opened. Everything starts at zero.', 'gold', ICO.star), 500);
    return;
  }

  const rec = accs[name];
  if (!rec) { authError('No record with that username on this device.'); return; }
  const hash = await hashPass(pass, rec.salt);
  if (hash !== rec.hash) { authError('Wrong password.'); return; }
  rec.last = Date.now();
  writeAccounts(accs);
  CURRENT_USER = name;
  localStorage.setItem(SESSION_KEY, name);
  startGame();
}

function signOut() {
  confirmDialog({

    }
  });
}

  { id: 'all', label: 'All' }, { id: 'active', label: 'Active' }, { id: 'completed', label: 'Completed' },
  { id: 'daily', label: 'Daily' }, { id: 'weekly', label: 'Weekly' }, { id: 'side', label: 'Side' },
  { id: 'grand', label: 'Grand' }, { id: 'boss', label: 'Boss' }, { id: 'event', label: 'Events' }
];
const questById = (id) => QUESTS.find(q => q.id === id);
const DAILY_IDS = QUESTS.filter(q => q.cat === 'daily').map(q => q.id);
const WEEKLY_IDS = QUESTS.filter(q => q.cat === 'weekly').map(q => q.id);

function qBucket(q) {
  if (q.cat === 'daily') return S.quests.daily;
  if (q.cat === 'weekly') return S.quests.weekly;
  return null;
}
function qProgress(id) {
  const q = questById(id);
  const b = qBucket(q);
  if (!b) return { p: 0, need: 1, done: false };
  return { p: b.progress[id] || 0, need: q.need || 1, done: (b.done || []).includes(id) };
}
function questDone(id) {
  const q = questById(id);
  if (q.grand) return !!S.grand.done;
  if (q.boss) return !!(S.bosses[q.boss] && S.bosses[q.boss].defeated);
  const pr = qProgress(id);
  return pr.done;
}
function bumpQuestEvent(event, n = 1) {
  QUESTS.forEach(q => {
    if (q.event !== event) return;
    const b = qBucket(q);
    if (!b) return;
    if ((b.done || []).includes(q.id)) return;
    b.progress[q.id] = (b.progress[q.id] || 0) + n;
    if (b.progress[q.id] >= (q.need || 1)) completeQuest(q.id, true);
  });
  save();
}
function completeQuest(id, silent) {
  const q = questById(id);
  if (!q || questDone(id)) return;
  const b = qBucket(q);
  if (b) {
    b.done = b.done || [];
    if (!b.done.includes(id)) b.done.push(id);
  }
  S.stats.quests += 1;
  S.daily.quests += 1;
  award({ xp: q.xp, coins: q.coins, item: q.item || null }, { noLevel: true });
  if (S.settings.notifQuest) toast(`Quest complete — ${q.title}`, 'green', ICO.check);
  const cKind = q.cat === 'daily' ? 'daily' : q.cat === 'weekly' ? 'weekly' : null;
  if (cKind) {
    const cs = chestStatus(cKind);
    if (cs.complete && !cs.claimed && !S['_chestToasted_' + cKind]) {
      S['_chestToasted_' + cKind] = true;
      setTimeout(() => toast(`${cKind === 'daily' ? 'Daily' : 'Weekly'} chest unlocked — open it in the quest log.`, 'gold', ICO.trophy), 700);
    }
  }
  pushNotif(`Quest completed: ${q.title}`);
  if (q.cat === 'boss' && q.boss) {
    const st = bossState(q.boss);
    if (st.defeated && !st.questDone) { st.questDone = true; }
  }
  checkAchievements();
  save();
  if (pendingLevels > 0) showLevelUp();
  if (!silent) refresh();
}

/* ------------------------------------------------------------------ weekly review */
function reviewStats() {
  const from = todayStr(addDays(new Date(), -6));
  const entries = Object.entries(S.activity || {}).filter(([d]) => d >= from);
  const xp = entries.reduce((a, b) => a + b[1], 0);
  const focus = (S.focusHistory || []).filter(f => f.date >= from);
  const mins = focus.reduce((a, b) => a + (b.minutes || 0), 0);
  const days = practiceRecord().filter(d => d >= from).length;
  const refl = (S.reflections || []).filter(r => r.date >= from).length;
  const best = entries.sort((a, b) => b[1] - a[1])[0];
  return { xp, sessions: focus.length, mins, days, refl, best: best ? best[0] : null };
}
function needsReview() {
  if (S.reviewWeek === undefined) S.reviewWeek = null;
  const past = practiceRecord().some(d => d < todayStr());
  return past && S.reviewWeek !== isoWeek();
}
function practiceStrip() {
  const days = new Set(practiceRecord());
  let out = '';
  for (let i = 27; i >= 0; i--) {
    const k = todayStr(addDays(new Date(), -i));
    out += `<span class="p-day ${days.has(k) ? 'on' : ''}" title="${k}"></span>`;
  }
  return out;
}
function openReview() {
  const st = reviewStats();
  openModal({
    title: 'Week in Review',
    sub: 'Seven days, no scoreboard — just what happened.',
    body: `
      <div class="daily-grid">
        <div class="dstat"><b>${st.days}</b><span>Days practised</span></div>

        <div class="dstat"><b>${st.sessions}</b><span>Focus sessions</span></div>
        <div class="dstat"><b>${st.mins}</b><span>Focus minutes</span></div>
      </div>
      ${st.best ? `<p class="tiny muted mt-s">Strongest day: ${fmtDate(st.best)} · ${(S.activity || {})[st.best] || 0} XP.</p>` : ''}
      <div class="field mt"><label for="rv1">What worked?</label><textarea id="rv1" placeholder="Evenings when the phone stayed in the other room."></textarea></div>
      <div class="field"><label for="rv2">What pulled at you most?</label><textarea id="rv2" placeholder="Boredom after dinner, mostly."></textarea></div>
      <div class="field"><label for="rv3">One change for next week</label><textarea id="rv3" placeholder="Set the stopping point before I start."></textarea></div>
      <p class="tiny muted">One review a week. Skipping it costs nothing.</p>`,
    actions: [
      { label: 'Skip this week', cls: 'ghost', onClick: () => { S.reviewWeek = isoWeek(); save(); closeModal(); refresh(); } },
      { label: 'Save review', cls: 'primary', onClick: () => {
        const answers = {};
        let filled = 0;
        [['rv1', 'worked'], ['rv2', 'pulled'], ['rv3', 'change']].forEach(([id, key]) => {
          const v = (($('#' + id) || {}).value || '').trim();
          answers[key] = v;
          if (v) filled++;
        });
        if (!filled) { toast('One line is enough — or skip the week freely.', 'red', ICO.book); return; }
        S.reviews = S.reviews || [];
        S.reviews.push({ week: isoWeek(), at: Date.now(), answers, stats: st });
        S.reviewWeek = isoWeek();
        closeModal();
        award({ xp: 80, coins: 20 });
        toast('Week reviewed. One change is all next week needs.', 'gold', ICO.book);
        save();
        refresh();
      } }
    ]
  });
}

function worldRestored() {
  const obj = S.grand.objectives.filter(Boolean).length * 8;
  const bosses = Math.min(48, (S.stats.bosses || 0) * 12);
  const focus = Math.min(20, Math.floor((S.stats.focusSessions || 0) / 2) * 2);
  const quests = Math.min(20, S.stats.quests || 0);
  return Math.min(100, obj + bosses + focus + quests);
}
function tierCorruption(i) {
  const base = TIER_CORRUPTION[i] !== undefined ? TIER_CORRUPTION[i] : 40;
  return Math.max(0, Math.round(base * (1 - worldRestored() / 100)));
}
function bossCorruption(bo) {
  const st = bossState(bo.id);
  if (st.defeated) return 0;
  return Math.max(0, Math.round(bo.corruption * (1 - worldRestored() / 100)));
}
function corruptionBand() {
  const r = worldRestored();
  return r >= 66 ? 'low' : r >= 33 ? 'mid' : 'high';
}

function practiceRecord() {
  const set = new Set(Object.keys(S.activity || {}).concat(((S.profile || {}).practiceDays) || []));
  return Array.from(set).sort();
}
function practiceThisWeek() {
  const cutoff = todayStr(addDays(new Date(), -6));
  return practiceRecord().filter(d => d >= cutoff).length;
}

function tierProgress(i) {
  if (i === 0) {
    const obj = S.grand.objectives.filter(Boolean).length;
    return Math.round((obj / 5) * 100);
  }
  const st = S.bosses['tier' + i];
  return st && st.cleared ? 100 : 0;
}

function tierUnlockInfo(i) {

    checks.push({ label: 'Clear Tier 2', ok: S.player.tier >= 3 });
    checks.push({ label: 'Complete 25 quests', ok: S.stats.quests >= 25 });
  } else if (i === 4) {
    checks.push({ label: 'Clear Tier 3', ok: S.player.tier >= 4 });
    checks.push({ label: 'Defeat 3 Supreme Leaders', ok: S.stats.bosses >= 3 });
  } else if (i === 5) {
    checks.push({ label: 'Clear Tier 4', ok: S.player.tier >= 5 });
    checks.push({ label: 'Record 30 focus sessions', ok: S.stats.focusSessions >= 30 });
  } else if (i === 6) {
    checks.push({ label: 'Clear Tier 5', ok: S.player.tier >= 6 });
    checks.push({ label: 'Unlock 12 skills', ok: Object.keys(S.skills).filter(k => S.skills[k].unlocked).length >= 12 });
  } else if (i === 7) {
    checks.push({ label: 'Clear Tier 6', ok: S.player.tier >= 7 });
    checks.push({ label: 'Defeat 5 Supreme Leaders', ok: S.stats.bosses >= 5 });
  } else if (i === 8) {
    checks.push({ label: 'Clear Tier 7', ok: S.player.tier >= 8 });
    checks.push({ label: 'Complete a grand quest of service', ok: S.grand.done });
  } else if (i === 9) {
    checks.push({ label: 'Clear Tier 8', ok: S.player.tier >= 9 });
    checks.push({ label: 'Write 100 reflections', ok: S.reflections.length >= 100 });

    checks.push({ label: 'Clear Tier 9', ok: S.player.tier >= 10 });

  }
  const pct = checks.length ? Math.round((checks.filter(c => c.ok).length / checks.length) * 100) : 100;
  return { checks, pct };
}

function bossState(id) {
  if (!S.bosses) S.bosses = {};
  if (!S.bosses[id]) S.bosses[id] = { hp: MAX_HP, defeated: false, strikes: 0, revealed: [], attempts: 0 };
  const b = S.bosses[id];
  if (typeof b.hp !== 'number') b.hp = MAX_HP;
  if (!Array.isArray(b.revealed)) b.revealed = [];
  return b;
}
function battleState() {
  if (!S.battle) S.battle = { bossId: null, log: [], lastSkill: null };
  if (!Array.isArray(S.battle.log)) S.battle.log = [];
  return S.battle;
}
function bossPhase(hp) {
  if (hp > 750) return 1;
  if (hp > 500) return 2;
  if (hp > 250) return 3;
  return 4;
}
function dmgMult() {
  const d = S.settings.difficulty;
  return d === 'gentle' ? 1.25 : d === 'hard' ? 0.8 : 1;
}
function blog(text, kind = 'sys') {
  const b = battleState();
  b.log.unshift({ t: text, k: kind });
  b.log = b.log.slice(0, 40);
}

function mechState() {
  const b = battleState();
  if (!b.mech || typeof b.mech !== 'object') b.mech = {};
  return b.mech;
}

function initMech(bossId) {
  const bo = bossById(bossId);
  const b = battleState();
  b.mech = {};
  if (!bo) return;
  const mech = bossMech(bo.id);
  const m = b.mech;
  m.revived = false;
  m.calmReady = hasPerk('calm');
  m.loop = 0;
  m.stop = false;
  m.fog = false;
  m.fogLeft = 0;
  m.offer = null;
  m.delayUntil = 0;
  m.delayDone = true;
  m.stormUsed = false;

  if (!mech) return;
  if (bo.id === 'procrastination') {
    m.delayUntil = Date.now() + (S.recovery ? 12000 : 30000);
    m.delayDone = false;
  }
  if (bo.id === 'avoidance') m.fog = true;
  if (bo.id === 'entertainment' && hasPerk('time')) {
    m.stop = true;
    blog('Ring of Time — your stopping point is already set.', 'you');
  }
  if (hasPerk('reveal')) {
    const st = bossState(bo.id);
    if (!st.revealed.length && bo.weaknesses.length) {
      st.revealed.push(0);
      blog(`Helmet of Awareness — weakness known before you enter: ${bo.weaknesses[0]}.`, 'win');
    }
  }
}

function mechLocked(bo) {
  const mech = bossMech(bo && bo.id);
  if (!mech || bo.id !== 'procrastination') return 0;
  const m = mechState();
  if (!m.delayUntil) return 0;
  return Math.max(0, Math.ceil((m.delayUntil - Date.now()) / 1000));
}

let battleTick = null;
function clearBattleTick() { if (battleTick) { clearInterval(battleTick); battleTick = null; } }
function ensureBattleTick() {
  clearBattleTick();
  battleTick = setInterval(() => {
    if (currentScreen !== 'battle') { clearBattleTick(); return; }
    const b = battleState();
    const bo = b.bossId ? bossById(b.bossId) : null;
    if (!bo) { clearBattleTick(); return; }
    const mech = bossMech(bo.id);
    const m = mechState();
    if (!mech) return;

    if (bo.id === 'scrolling' && m.offer) {
      const left = Math.max(0, Math.ceil((m.offer.until - Date.now()) / 1000));
      const node = $('#offerCount');
      if (node) node.textContent = left + 's';
      if (left <= 0) {
        m.offer = null;
        S.currencies.focusEnergy = clamp(S.currencies.focusEnergy + 8);
        blog('You let the extra video go. The pull loosens.', 'you');
        save();
        refresh();
        return;
      }
    }
    if (bo.id === 'procrastination' && m.delayUntil && !m.delayDone) {
      const left = Math.max(0, Math.ceil((m.delayUntil - Date.now()) / 1000));
      const node = $('#delayCount');
      if (node) node.textContent = '00:' + String(left).padStart(2, '0');
      if (left <= 0) {
        m.delayDone = true;
        m.delayUntil = 0;
        blog('The wait is over. You can strike — but you could have started at any point.', 'sys');
        refresh();
      }
    }
  }, 1000);
}

function mechDamageMult(bo) {
  const mech = bossMech(bo.id);
  const m = mechState();
  let mult = 1;
  if (mech && bo.id === 'gaming') mult *= 1 + 0.15 * Math.min(3, m.loop || 0);
  if (mech && bo.id === 'entertainment' && m.stop) mult *= 1.15;
  return mult;
}

function mechAfterStrike(bo, st) {
  const mech = bossMech(bo.id);
  if (!mech) return;
  const m = mechState();

  if (bo.id === 'scrolling') {
    m.offer = { until: Date.now() + 9000 };
    blog('It slides one more video in front of you. Free damage, no challenge.', 'boss');
  }
  if (bo.id === 'gaming') {
    m.loop = (m.loop || 0) + 1;
    if (m.loop >= 4) {
      const heal = S.recovery ? 60 : 120;
      st.hp = Math.min(MAX_HP, st.hp + heal);
      m.loop = 0;
      blog(`The loop closes — ${bo.short} heals ${heal}. Four in a row is the trap.`, 'boss');
      toast('The reward loop closed and it healed. Step away between strikes.', 'red', ICO.dice);
    } else {
      blog(`Reward loop ×${m.loop} — the next strike hits harder, and so does the trap.`, 'boss');
    }
  }
  if (bo.id === 'entertainment') {
    if (m.stop) {
      m.stop = false;
      blog('Stopping point kept — autoplay never started.', 'you');
    } else {
      const heal = S.recovery ? 20 : 45;
      st.hp = Math.min(MAX_HP, st.hp + heal);
      blog(`Autoplay: the next episode begins. ${bo.short} heals ${heal}.`, 'boss');
    }
  }
  if (bo.id === 'procrastination') {
    m.delayUntil = Date.now() + (S.recovery ? 8000 : 12000);
    m.delayDone = false;
    blog('Delay Curse — it wants you to wait again.', 'boss');
  }
  if (bo.id === 'avoidance' && m.fogLeft > 0) {
    m.fogLeft -= 1;
    if (m.fogLeft <= 0) {
      m.fog = true;
      blog('The fog rolls back in over its health.', 'boss');
    }
  }
}

function mechPanelHtml(bo) {
  const mech = bossMech(bo.id);
  if (!mech) return '';
  const m = mechState();
  let live = '';
  if (bo.id === 'scrolling') {
    live = m.offer
      ? `<div class="mech-offer">
           <div class="row between"><b>ONE MORE</b><span class="chip crimson" id="offerCount">9s</span></div>
           <p class="tiny muted">A free strike, no challenge. It heals ${S.recovery ? 45 : 90} if you take it.</p>
           <div class="btn-row mt-s">
             <button class="btn sm danger" data-act="takeOffer">TAKE IT</button>
             <button class="btn sm ghost" data-act="dropOffer">PUT IT DOWN</button>
           </div>
         </div>`
      : `<span class="chip">No offer on the table</span>`;
  }
  if (bo.id === 'gaming') {
    live = `<div class="row between wrap">
        <span class="chip ${m.loop >= 3 ? 'crimson' : m.loop ? 'gold' : ''}">LOOP ×${m.loop || 0}</span>
        <button class="btn sm ghost" data-act="stepAway" ${m.loop ? '' : 'disabled'}>STEP AWAY</button>
      </div>
      <p class="tiny muted mt-s">Chain three for the bonus. The fourth closes the loop and heals it.</p>`;
  }
  if (bo.id === 'procrastination') {
    const secs = mechLocked(bo);
    live = secs > 0
      ? `<div class="row between wrap">
           <span class="chip crimson">WAIT <b id="delayCount">00:${String(secs).padStart(2, '0')}</b></span>
           <button class="btn sm primary" data-act="startNow">START NOW</button>
         </div>
         <p class="tiny muted mt-s">Waiting is the trap. Start now and it loses its hold.</p>`
      : `<span class="chip green">You can strike</span>`;
  }
  if (bo.id === 'entertainment') {
    live = `<div class="row between wrap">
        <span class="chip ${m.stop ? 'green' : ''}">STOPPING POINT ${m.stop ? 'SET' : 'NOT SET'}</span>
        <button class="btn sm ${m.stop ? 'ghost' : 'primary'}" data-act="toggleStop">${m.stop ? 'CLEAR' : 'SET IT'}</button>
      </div>
      <p class="tiny muted mt-s">Set it before you strike and the autoplay heal never lands. +15% damage.</p>`;
  }
  if (bo.id === 'notifications') {
    const shielded = hasPerk('shield_focus') && !m.stormUsed;
    live = `<div class="row between wrap">
        <span class="chip ${shielded ? 'green' : 'crimson'}">${shielded ? 'SHIELD OF SILENCE READY' : 'STORM INBOUND'}</span>
        <span class="tiny muted">One burst per challenge</span>
      </div>`;
  }
  if (bo.id === 'avoidance') {
    live = `<div class="row between wrap">
        <span class="chip ${m.fog ? 'crimson' : 'green'}">${m.fog ? 'HEALTH HIDDEN' : 'FOG CLEARED · ' + (m.fogLeft || 0) + ' STRIKES'}</span>
        <button class="btn sm ${m.fog ? 'primary' : 'ghost'}" data-act="faceFog">${m.fog ? 'FACE THE FOG' : 'NAME IT AGAIN'}</button>
      </div>`;
  }

  return `<div class="mech-panel">
    <div class="panel-title">${ICO.skull} ${mech.name}</div>
    <p class="tiny muted mech-rule">${mech.rule}</p>
    ${live}
  </div>`;
}

/* ------------------------------------------------------------------ battle flow */
function enterBattle(bossId) {
  const bo = bossById(bossId);
  if (!bo) return;
  const st = bossState(bossId);
  st.attempts = (st.attempts || 0) + 1;
  const b = battleState();
  b.bossId = bossId;
  b.lastSkill = null;
  initMech(bossId);
  blog(`You enter the arena of ${bo.name}.`, 'sys');
  blog(`${bo.short} opens with ${pick(bo.abilities)}.`, 'boss');
  save();
  go('battle');
}
function leaveBattle() {
  const b = battleState();
  b.bossId = null;
  save();
  toast('You retreat with your progress intact.', 'info', ICO.shield);
  go('battle');
}

function applyStrike(skillId, success, note) {
  const b = battleState();
  const bo = bossById(b.bossId);
  if (!bo) return;
  const st = bossState(bo.id);
  const sk = BATTLE_SKILLS.find(s => s.id === skillId);
  if (!sk) return;
  const score = typeof success === 'number' ? success : (success ? 2 : 0);
  const mM = mechState();
  if (mM.offer) mM.offer = null;

  if (score > 0) {
    const dmg = Math.max(1, Math.round(sk.dmg * dmgMult() * mechDamageMult(bo) * (S.recovery ? 1.1 : 1) * (score / 2)));
    if (score === 1) blog('A partial read — half a strike. It still lands.', 'sys');
    st.hp = Math.max(0, st.hp - dmg);
    st.strikes += 1;
    b.lastSkill = skillId;
    blog(note || `You used ${sk.name}.`, 'you');
    blog(`Boss damage: ${dmg}.`, 'you');
    if (sk.id === 'recovery_burst') {
      S.currencies.focusEnergy = clamp(S.currencies.focusEnergy + 22);
      S.stats.setbacksRecovered += 1;
      blog('Recovery Burst restored focus energy.', 'you');
    }
    if (sk.id === 'awareness_break') S.stats.awareness += 1;
    if (sk.id === 'boundary_shield') S.stats.timeChallenges += 1;
    bumpQuestEvent('boss_hit');

    // reveal a weakness every two strikes
    if (st.strikes % 2 === 0 && st.revealed.length < bo.weaknesses.length) {
      const next = st.revealed.length;
      st.revealed.push(next);
      blog(`Boss weakness revealed — ${bo.weaknesses[next]}.`, 'win');
      pushNotif(`Boss weakness revealed: ${bo.weaknesses[next]}`);
    }
    if (st.hp <= 250 && st.hp > 0) blog(`${bo.short} enters ${PHASES[3]} — it is running out of illusions.`, 'boss');

    if (st.hp <= 0) {
      defeatBoss(bo);
      return;
    }
    mechAfterStrike(bo, st);
  } else {
    let cost = S.recovery ? 8 : 15;
    if (mM.calmReady && hasPerk('calm')) {
      cost = Math.max(1, Math.round(cost / 2));
      mM.calmReady = false;
      blog('Cloak of Recovery softened the first blow.', 'you');
    } else if (S.buffs && S.buffs.calm) {
      cost = Math.max(1, Math.round(cost / 2));
      S.buffs.calm = false;
      blog('Potion of Calm softened the counterattack.', 'you');
    }
    S.currencies.focusEnergy = clamp(S.currencies.focusEnergy - cost);
    blog(`${bo.short} unleashed ${pick(bo.abilities)}.`, 'boss');
    blog(`Focus energy −${cost}. ${S.currencies.focusEnergy <= 0 ? 'You are drained — step back and recover.' : 'Try a different approach.'}`, 'sys');
    if (S.currencies.focusEnergy <= 0) {
      if (hasPerk('revive') && !mM.revived) {
        mM.revived = true;
        S.currencies.focusEnergy = 40;
        blog('Phoenix Pendant — you return instead of withdrawing.', 'you');
        toast('The pendant pulls you back into the fight.', 'green', ICO.flame);
        save();
        refresh();
        return;
      }
      S.currencies.focusEnergy = 35;
      b.bossId = null;
      blog('You withdraw. Your progress against this leader is kept.', 'sys');
      save();
      go('battle');
      toast('Focus drained. Rest, then return — the boss keeps its wounds.', 'red', ICO.heart);
      return;
    }
    Sound.fail();
  }
  save();
  refresh();
}

function defeatBoss(bo) {
  const st = bossState(bo.id);
  st.defeated = true;
  st.hp = 0;
  S.stats.bosses += 1;
  blog(`${bo.name} is defeated. Corruption in this region breaks apart.`, 'win');
  battleState().bossId = null;
  award({ xp: 300, coins: 150, shadow: 1, item: 'core_shadow' }, { noLevel: true });
  const qid = 'q_boss_' + bo.id;
  completeQuest(qid, true);
  pushNotif(`Boss defeated: ${bo.name}`);
  checkAchievements();
  maybeUnlockTiers();
  save();
  refresh();
  openModal({
    title: 'VICTORY',
    sub: bo.name,
    body: `<div class="result-box">
      <div class="big">DEFEATED</div>
      <p class="small muted" style="line-height:1.6">You did not beat a monster. You practised the exact weakness it was built on: ${bo.weaknesses[0].toLowerCase()}. That is the only damage that lasts.</p>
      <div class="btn-row center mt" style="justify-content:center">
        <span class="chip gold">+300 XP</span><span class="chip gold">+150 coins</span><span class="chip purple">Shadow Core</span>
      </div>
    </div>`,
    actions: [{ label: 'Continue', cls: 'primary', onClick: () => { closeModal(); go('battle'); } }]
  });
}

function maybeUnlockTiers() {
  let unlockedAny = false;
  for (let i = S.player.tier + 1; i < TIERS.length; i++) {
    const info = tierUnlockInfo(i);
    if (info.checks.length && info.checks.every(c => c.ok)) {
      S.player.tier = i;
      unlockedAny = true;
      toast(`New realm discovered — Tier ${i}: ${TIERS[i].name}`, 'gold', ICO.portal);
      pushNotif(`New realm discovered: Tier ${i} — ${TIERS[i].name}`);
      checkAchievements();
    } else break;
  }
  if (unlockedAny) {
    S.player.attributes.mind = clamp(S.player.attributes.mind + 2);
    save();
  }
}

/* ------------------------------------------------------------------ challenges */
function useSkill(skillId, force) {
  const b = battleState();
  if (!b.bossId) return;
  const sk = BATTLE_SKILLS.find(s => s.id === skillId);
  if (!sk) return;
  const boNow = bossById(b.bossId);
  if (!force && mechLocked(boNow) > 0) {
    blog("Tomorrow's Promise — it says: start later. Waiting is the trap.", 'boss');
    toast('It will not let you strike yet. Press START NOW — starting beats waiting.', 'red', ICO.timer);
    save();
    refresh();
    return;
  }
  if (b.lastSkill === skillId) {
    toast('Same strike refused — choose a different approach.', 'red', ICO.shield);
    return;
  }
  if (S.recovery && (skillId === 'focus_strike')) {
    toast('Shadow Mode hides the hardest challenges. Try Awareness or Recovery.', 'info', ICO.moon);
    return;
  }
  if (skillId === 'focus_strike') return openFocusStrike();
  if (skillId === 'recovery_burst') return openRecoveryBurst();
  return openNuanceChallenge(skillId);
}

function openNuanceChallenge(skillId) {
  const sk = BATTLE_SKILLS.find(s => s.id === skillId);
  const { item, opts } = challengePick(skillId);
  let answered = false;
  openModal({
    title: sk.name,
    sub: item.s,
    body: `<div class="chart-title">${item.q}</div>
      <div id="chalOpts">
        ${opts.map((o, i) => `<button class="chal-opt" data-i="${i}">${esc(o.t)}<small class="co-fb" hidden></small></button>`).join('')}
      </div>
      <p class="tiny muted">Every option here is defensible. Damage is scored by how far the reading reaches into the mechanism — not by guessing what I wanted.</p>`,
    actions: [],
    onMount: (m, close) => {
      const btns = $$('.chal-opt', m);
      const wrap = document.createElement('div');
      wrap.className = 'modal-actions';
      wrap.innerHTML = '<button class="btn primary wide" data-continue="1">CONTINUE</button>';
      wrap.hidden = true;
      m.appendChild(wrap);

      // Notification Storm — the boss interrupts mid-challenge
      const boNow = bossById(battleState().bossId);
      const mechNow = boNow ? bossMech(boNow.id) : null;
      const mS = mechState();
      if (mechNow && mechNow.id === 'storm' && !mS.stormUsed) {
        if (hasPerk('shield_focus')) {
          mS.stormUsed = true;
          blog('Shield of Silence absorbed the storm before it landed.', 'you');
          save();
        } else {
          setTimeout(() => {
            if (answered || !document.body.contains(m)) return;
            mS.stormUsed = true;
            const storm = document.createElement('div');
            storm.className = 'storm';
            storm.innerHTML = `<div class="storm-card">
              <div class="storm-app">MESSAGES · now</div>
              <div class="storm-text">${pick(['Your screen time report is ready.', 'Someone liked a photo you posted in 2019.', 'Flash sale ends in 40 minutes.', 'You have not opened this app in 3 days. Come back!'])}</div>
              <button class="btn sm primary" data-ignore="1">IGNORE</button>
            </div>`;
            m.appendChild(storm);
            storm.querySelector('[data-ignore]').addEventListener('click', () => {
              storm.remove();
              blog('You ignored it. Your options come back.', 'you');
              save();
            });
            blog('Notification Storm — your options are buried under it.', 'boss');
            Sound.fail();
          }, 3600);
        }
      }

      const go2 = (score, label) => {
        close();
        applyStrike(skillId, score, label);
      };

      btns.forEach(btn => btn.addEventListener('click', () => {
        if (answered) return;
        answered = true;
        const idx = Number(btn.dataset.i);
        const chosen = opts[idx];
        btns.forEach((o, i) => {
          const opt = opts[i];
          o.classList.add(opt.s === 2 ? 'good' : opt.s === 1 ? 'mid' : 'bad');
          if (i === idx) o.classList.add('picked');
          const fb = o.querySelector('.co-fb');
          if (fb) {
            fb.hidden = false;
            fb.textContent = (i === idx ? 'You chose this · ' + opt.s + '/2 — ' : opt.s + '/2 — ') + opt.fb;
          }
          o.disabled = true;
        });
        const label = chosen.s === 2
          ? `${sk.name} — you went for the mechanism, not the symptom.`
          : chosen.s === 1
            ? `${sk.name} — partly useful: ${chosen.t.toLowerCase()}`
            : `${sk.name} — that reading lets the pattern off the hook.`;
        wrap.hidden = false;
        wrap.querySelector('[data-continue]').addEventListener('click', () => go2(chosen.s, label));
        if (chosen.s === 0) Sound.fail(); else Sound.reward();
      }));
    },
    onDismiss: () => {
      if (!answered) applyStrike(skillId, 0, 'You left the challenge without answering — the pattern keeps the ground.');
    }
  });
}

let questFilter = 'all';

/* ================================================================== CHESTS */
const CHEST_ODDS = {
  daily: [['common', 50], ['rare', 32], ['epic', 15], ['legendary', 3]],
  weekly: [['common', 10], ['rare', 26], ['epic', 38], ['legendary', 22], ['transcendent', 4]]
};
const RARITY_COINS = { common: 40, rare: 90, epic: 180, legendary: 350, transcendent: 600 };
const CHEST_CATS = ['weapon', 'armor', 'accessory', 'artifact'];
const RARITY_ORDER_UP = ['common', 'rare', 'epic', 'legendary', 'transcendent'];

function chestStatus(kind) {
  const ids = kind === 'daily' ? DAILY_IDS : WEEKLY_IDS;
  const done = ids.filter(id => questDone(id)).length;
  const claimed = kind === 'daily' ? !!S.chests.daily.claimed : !!S.chests.weekly.claimed;
  return { done, total: ids.length, complete: done >= ids.length, claimed, ready: done >= ids.length && !claimed };
}
function rollRarity(kind) {
  let table = CHEST_ODDS[kind].map(pair => pair.slice());
  if (hasPerk('crown')) {
    table = table.map(pair => {
      const up = RARITY_ORDER_UP[Math.min(RARITY_ORDER_UP.length - 1, RARITY_ORDER_UP.indexOf(pair[0]) + 1)];
      return [up, pair[1]];
    });
  }
  const total = table.reduce((a, p) => a + p[1], 0);
  let x = Math.random() * total;
  for (const pair of table) { if ((x -= pair[1]) <= 0) return pair[0]; }
  return table[0][0];
}
function chestPool(rarity) {
  return ITEMS.filter(i => CHEST_CATS.indexOf(i.cat) >= 0 && i.rarity === rarity);
}
function draftCards(kind) {
  const cards = [];
  const usedIds = [];
  let guard = 0;
  while (cards.length < 3 && guard++ < 24) {
    let rarity = rollRarity(kind);
    let pool = chestPool(rarity).filter(i => usedIds.indexOf(i.id) < 0 && !ownedQty(i.id));
    let tries = 0;
    while (!pool.length && tries++ < 5) {
      rarity = rollRarity(kind);
      pool = chestPool(rarity).filter(i => usedIds.indexOf(i.id) < 0 && !ownedQty(i.id));
    }
    if (!pool.length) pool = chestPool(rarity).filter(i => usedIds.indexOf(i.id) < 0);
    if (!pool.length) break;
    const it = pick(pool);
    usedIds.push(it.id);
    cards.push(it);
  }
  return cards;
}
function openChest(kind) {
  const st = chestStatus(kind);
  if (st.claimed) { toast('This chest has already been opened.', 'info', ICO.lock); return; }
  if (!st.complete) {
    toast(kind === 'daily' ? `Daily chest needs all ${st.total} daily quests.` : `Weekly chest needs all ${st.total} weekly quests.`, 'red', ICO.lock);
    return;
  }
  const cards = draftCards(kind);
  if (!cards.length) { toast('Nothing left to drop — every piece is already yours.', 'gold', ICO.trophy); return; }

  openModal({
    title: kind === 'daily' ? 'Daily Chest' : 'Weekly Chest',
    sub: kind === 'daily'
      ? 'Three cards, one choice. No re-roll, no purchase, no second pull.'
      : 'Three cards, one choice — and the odds are stacked toward the rare end.',
    body: `<div class="chest-cards">
      ${cards.map(c => `
        <button class="chest-card r-${c.rarity}" data-pick="${c.id}">

          <span class="cc-rar ${RARITY[c.rarity].cls}">${RARITY[c.rarity].label}</span>
          <span class="cc-name">${c.name}</span>

        </button>`).join('')}
    </div>
    <p class="tiny muted mt-s">Choosing is the mechanic. A slot machine would teach the opposite of this game.</p>`,
    actions: [],
    onMount: (m, close) => {
      $$('[data-pick]', m).forEach(btn => btn.addEventListener('click', () => {
        takeChestCard(kind, btn.dataset.pick, close);
      }));
    }
  });
}
function takeChestCard(kind, itemId, close) {
  const it = itemById(itemId);
  if (!it) return;
  const coins = kind === 'daily' ? 60 + rnd(60) : 250 + rnd(150);
  const crystals = kind === 'weekly' ? 1 : 0;
  const dup = ownedQty(itemId) > 0;
  const dupShards = dup ? SHARD_VALUE[it.rarity] : 0;
  const dupCoins = 0;

  if (dup) {

    addItem(itemId, 1);

  S.currencies.coins += coins;
  S.stats.coinsEarned += coins;
  S.daily.coins += coins;
  if (crystals) S.currencies.crystals += crystals;

  if (kind === 'daily') S.chests.daily = { date: todayStr(), claimed: true };
  else S.chests.weekly = { week: isoWeek(), claimed: true };

  pushNotif(`${kind === 'daily' ? 'Daily' : 'Weekly'} chest opened — ${it.name}${dup ? ' (duplicate)' : ''}`);
  checkAchievements();
  save();
  if (close) close();
  refresh();
  Sound.reward();

  openModal({
    title: dup ? 'Already yours' : 'Acquired',
    sub: it.name,
    body: `<div class="result-box">
      <div class="chest-reveal r-${it.rarity}">

        <div class="cc-rar ${RARITY[it.rarity].cls}">${RARITY[it.rarity].label}</div>
        <div class="cc-name" style="font-size:15px">${it.name}</div>
        <p class="tiny muted">${it.desc}</p>

      </div>
      <div class="btn-row center mt" style="justify-content:center">
        <span class="chip gold">${ICO.coin} +${coins + dupCoins}</span>
        ${crystals ? `<span class="chip blue">${ICO.crystal} +1</span>` : ''}
        ${dup ? `<span class="chip purple">${ICO.crystal} +${dupShards} shards</span>` : ''}
      </div>
      <p class="tiny muted mt">${dup ? 'You already carried this one — it broke down into shards for the Forge.' : 'In your inventory. Equip it to make it work.'}</p>
    </div>`,
    actions: [{ label: 'Close', cls: 'primary', onClick: closeModal }]

}

function takeOne(id) {
  const inv = S.inventory.find(i => i.id === id);
  if (!inv) return;
  inv.qty -= 1;
  if (inv.qty <= 0) S.inventory = S.inventory.filter(i => i.id !== id);
}
function doForgeUp(r) {
  const st = canForgeUp(r);
  if (!st.ok) { toast('Not enough pieces or shards for that forge.', 'red', ICO.lock); return; }
  const picked = [];
  const pool = gearOfRarity(r, true).slice();
  while (picked.length < 3 && pool.length) {
    const inv = pool[0];
    picked.push(inv.id);
    takeOne(inv.id);
    const still = S.inventory.find(i => i.id === inv.id);
    if (!still) pool.shift();
  }
  S.currencies.shards -= st.cost;
  S.forge.forged = (S.forge.forged || 0) + 1;
  const nextPool = chestPool(st.next).filter(i => !ownedQty(i.id));
  const prize = nextPool.length ? pick(nextPool) : (chestPool(st.next).length ? pick(chestPool(st.next)) : null);
  if (prize) addItem(prize.id, 1);
  save();
  closeModal();
  refresh();
  Sound.reward();
  openModal({
    title: 'Forged',
    sub: st.next.toUpperCase(),
    body: `<div class="result-box">
      <div class="chest-reveal r-${prize ? prize.rarity : 'rare'}">
        <span class="cc-ico ${prize ? RARITY[prize.rarity].cls : ''}">${ICO[prize ? (CAT_ICON[prize.cat] || prize.icon) : 'gem']}</span>
        <div class="cc-name" style="font-size:15px">${prize ? prize.name : 'Nothing'}</div>
        <p class="tiny muted">${prize ? prize.effect : 'The pool for that rarity is empty.'}</p>
      </div>
      <p class="tiny muted mt">Three pieces and ${st.cost} shards went into it. What comes out is not your choice.</p>
    </div>`,
    actions: [{ label: 'Close', cls: 'primary', onClick: () => { closeModal(); openForge(); } }]
  });
}
function meltItem(id) {
  const it = itemById(id);
  if (!it) return;
  const inv = S.inventory.find(i => i.id === id);
  if (!inv) return;
  if (inv.equipped) { toast('Unequip it first.', 'red', ICO.lock); return; }
  const value = SHARD_VALUE[it.rarity] * (inv.qty > 1 ? 1 : 1);
  confirmDialog({
    title: 'Break down ' + it.name + '?',
    body: `<p class="small" style="line-height:1.6">It becomes <b>${value} shards</b> and is gone for good. You can forge something better with them.</p>`,
    confirmLabel: 'Break it down',
    onConfirm: () => {
      removeItem(id, 1);
      S.currencies.shards = shardCount() + value;
      S.forge.melted = (S.forge.melted || 0) + 1;
      save();
      toast(`+${value} shards.`, 'purple' === 'purple' ? 'gold' : 'gold', ICO.crystal);
      refresh();
      openForge();
    }
  });
}
function sacrificeForSlot() {
  const pool = gearOfRarity('legendary', true);
  const total = pool.reduce((a, b) => a + b.qty, 0);
  if (!total) { toast('You have no legendary to give up.', 'red', ICO.lock); return; }

function pactItem() { return S.pact && S.pact.itemId ? itemById(S.pact.itemId) : null; }
function pactActive() { return !!(S.pact && S.pact.week === isoWeek() && S.pact.itemId); }
function pactDue() {
  return !!(pactActive() && S.pact.result === null && new Date().getDay() === 0);
}
function setPact(id) {
  const it = itemById(id);
  if (!it) return;
  if (!CHEST_CATS.includes(it.cat)) { toast('Only gear can be carried as an emblem.', 'red', ICO.lock); return; }

  S.pact = { week: isoWeek(), itemId: id, startedAt: Date.now(), result: null };
  save();
  closeModal();
  refresh();
  toast(`${it.name} is your emblem this week. Tell someone to ask you on Sunday.`, 'gold', ICO.star);
  pushNotif(`Weekly pact started — ${it.name}`);
}
function resolvePact(kept) {
  if (!pactActive()) return;
  S.pact.result = kept ? 'kept' : 'released';
  if (kept) {
    S.profile.practiceDays = S.profile.practiceDays || [];

function weekLabel() {

function drawSigil(x, cat, color, cx, cy, size) {
  return new Promise(resolve => {
    const raw = (ICO[CAT_ICON[cat] || 'gem'] || '').replace(/currentColor/g, color);
    const svgStr = raw.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
    const img = new Image();
    img.onload = () => { try { x.drawImage(img, cx - size / 2, cy - size / 2, size, size); } catch (e) {} resolve(); };
    img.onerror = () => resolve();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
  });
}
function roundRect(x, X, Y, W, H, R) {
  x.beginPath();
  x.moveTo(X + R, Y);
  x.lineTo(X + W - R, Y); x.quadraticCurveTo(X + W, Y, X + W, Y + R);
  x.lineTo(X + W, Y + H - R); x.quadraticCurveTo(X + W, Y + H, X + W - R, Y + H);
  x.lineTo(X + R, Y + H); x.quadraticCurveTo(X, Y + H, X, Y + H - R);
  x.lineTo(X, Y + R); x.quadraticCurveTo(X, Y, X + R, Y);
  x.closePath();
}
function wrapText(x, text, cx, y, maxW, lh) {
  const words = String(text).split(' ');
  let line = '';
  const lines = [];
  words.forEach(w => {
    const test = line ? line + ' ' + w : w;
    if (x.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  });
  if (line) lines.push(line);
  lines.forEach((l, i) => x.fillText(l, cx, y + i * lh));
  return y + lines.length * lh;
}

  x.fillStyle = gold; x.fillRect(0, 0, 1080, 1350);

async function downloadPactCard() {

function openItem(id) {
  const it = itemById(id);
  if (!it) return;
  const inv = S.inventory.find(i => i.id === id);
  const isGear = ['weapon', 'armor', 'accessory', 'artifact'].includes(it.cat);
  const slotCap = it.cat === 'artifact' ? relicSlots() : 1;
  const actions = [{ label: 'Close', cls: 'ghost', onClick: closeModal }];

  if (isGear && slotCap > 0) {
    actions.unshift({
      label: inv && inv.equipped ? 'Unequip' : 'Equip', cls: 'primary', onClick: () => {
        if (!inv) return;
        if (inv.equipped) { inv.equipped = false; }
        else {
          const sameCat = S.inventory.filter(o => o.equipped && (itemById(o.id) || {}).cat === it.cat);
          while (sameCat.length >= slotCap) { const drop = sameCat.shift(); drop.equipped = false; }
          inv.equipped = true;
        }
        save(); closeModal(); refresh();
        toast(inv.equipped ? `${it.name} equipped.` : `${it.name} unequipped.`, 'green', ICO.shield);
      }
    });
  }
  if (it.cat === 'artifact' && slotCap === 0) {
    actions.unshift({
      label: 'Open the Forge', cls: 'primary', onClick: () => { closeModal(); openForge(); }
    });
  }
  if (isGear) {
    actions.push({
      label: 'Carry this week', cls: 'gold', onClick: () => setPact(it.id)
    });
  }
  if (it.cat === 'consumable') {
    actions.unshift({
      label: 'Use', cls: 'primary', onClick: () => { closeModal(); useItem(id); }

  }
  openModal({
    title: it.name,

    body: `<div class="row" style="gap:12px;margin-bottom:12px">
        <span class="loc-art" style="width:56px;height:56px;border-radius:14px;color:var(--text)">${ICO[CAT_ICON[it.cat] || it.icon]}</span>
        <div>
          <span class="chip ${RARITY[it.rarity].cls}">${RARITY[it.rarity].label}</span>
          ${inv && inv.equipped ? '<span class="chip blue">EQUIPPED</span>' : ''}
          <span class="chip">×${inv ? inv.qty : 0}</span>
        </div>
      </div>
      <p class="small" style="line-height:1.6">${it.desc}</p>
      <div class="chart-title mt">Effect</div>

      ${it.cat === 'artifact' && relicSlots() === 0 ? `<p class="tiny crimson mt">Relic slot locked — sacrifice a legendary in the Forge to wear artifacts.</p>` : ''}
      <div class="chart-title mt">Unlock condition</div>
      <p class="small muted">${it.unlock}</p>`,
    actions
  });
}

function useItem(id) {
  const it = itemById(id);
  if (!it) return;
  if (!ownedQty(id)) { toast('You do not have that item.', 'red', ICO.lock); return; }
  switch (id) {
    case 'potion_clarity':
      S.currencies.focusEnergy = clamp(S.currencies.focusEnergy + 30);
      toast('Clarity restores 30 focus energy.', 'green', ICO.energy);
      break;
    case 'potion_calm':
      S.buffs = S.buffs || {};
      S.buffs.calm = true;
      toast('Calm is active — the next counterattack is halved.', 'green', ICO.shield);
      break;
    case 'potion_momentum':
      removeItem(id, 1); save();
      award({ xp: 50 });
      toast('Momentum granted 50 XP.', 'gold', ICO.energy);
      refresh();
      return;
    case 'potion_renewal':
      S.recovery = false;
      removeItem(id, 1); save();
      award({ xp: 30 });
      toast('Renewal — you are back on the main path.', 'green', ICO.heart);
      refresh();
      return;
    case 'scroll_wisdom':
      S.player.skillPoints += 1;
      toast('Scroll of Wisdom — +1 skill point.', 'gold', ICO.star);
      break;
    default:
      toast('This item is a material. It has no direct use yet.', 'info', ICO.cube);
      return;
  }
  removeItem(id, 1);
  save();
  refresh();
}

function unlockSkill(id) {
  const node = skillById(id);
  if (!node) return;
  if (skillUnlocked(id)) { toast('Already learned.', 'info', ICO.check); return; }
  const av = skillAvailable(node);
  if (!av.ok) { toast(av.why, 'red', ICO.lock); return; }
  S.skills[id] = { unlocked: true, level: 1, at: Date.now() };
  S.player.skillPoints -= 1;
  const key = node.attr || 'mind';
  S.player.attributes[key] = clamp((S.player.attributes[key] || 0) + 4);
  S.stats.skillsUnlocked = (S.stats.skillsUnlocked || 0) + 1;
  bumpQuestEvent('skill');
  checkAchievements();
  save();
  Sound.reward();
  toast(`${node.name} learned — +4 ${ATTRS.find(a => a.key === key).name}.`, 'green', ICO.tree);
  pushNotif(`Skill unlocked: ${node.name}`);
  refresh();
}

/* ------------------------------------------------------------------ charts */
function chartBars(data, { color = '#43B7FF', gid = 'gb', unit = '' } = {}) {
  const W = 320, H = 132, padL = 8, padB = 22, padT = 10;
  const max = Math.max(1, ...data.map(d => d.value));
  const bw = (W - padL * 2) / data.length;
  const bars = data.map((d, i) => {
    const h = ((H - padB - padT) * d.value) / max;
    const x = padL + i * bw + bw * 0.18;
    const w = bw * 0.64;
    const y = H - padB - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="3" fill="url(#${gid})"/>
      <text class="axis-t" x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${d.label}</text>
      ${d.value ? `<text class="axis-t" x="${(x + w / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" fill="#F1F4F9">${d.value}${unit}</text>` : ''}`;
  }).join('');
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="${gid}" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity=".95"/>
    </linearGradient></defs>
    ${[0, .5, 1].map(f => `<line class="grid-l" x1="${padL}" x2="${W - padL}" y1="${(padT + (H - padB - padT) * f).toFixed(1)}" y2="${(padT + (H - padB - padT) * f).toFixed(1)}"/>`).join('')}
    ${bars}
  </svg>`;
}

function chartLine(data, { color = '#55D69A', gid = 'gl' } = {}) {
  const W = 320, H = 132, padL = 10, padB = 22, padT = 12;
  const max = Math.max(1, ...data.map(d => d.value));
  const step = (W - padL * 2) / Math.max(1, data.length - 1);
  const pts = data.map((d, i) => {
    const x = padL + i * step;
    const y = H - padB - ((H - padB - padT) * d.value) / max;
    return [x, y];
  });
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
  const area = `${path} L${pts[pts.length - 1][0].toFixed(1)} ${H - padB} L${pts[0][0].toFixed(1)} ${H - padB} Z`;
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    ${[0, .5, 1].map(f => `<line class="grid-l" x1="${padL}" x2="${W - padL}" y1="${(padT + (H - padB - padT) * f).toFixed(1)}" y2="${(padT + (H - padB - padT) * f).toFixed(1)}"/>`).join('')}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p, i) => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="${color}"/>
      <text class="axis-t" x="${p[0].toFixed(1)}" y="${H - 8}" text-anchor="middle">${data[i].label}</text>`).join('')}
  </svg>`;
}

function last7() {
  const out = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDays(new Date(), -i);
    const key = todayStr(d);
    out.push({ key, label: d.toLocaleDateString('en-IN', { weekday: 'short' }).slice(0, 2), date: d });
  }
  return out;
}

/* ================================================================== SETTINGS */
/* ================================================================== AMBIENT
   Local sound awareness. Audio is analysed in this browser and discarded —
   nothing is recorded, stored or uploaded. No words are kept.
   ====================================================================== */
const AMBIENT = {
  ctx: null, stream: null, analyser: null, buf: null, raf: 0,
  baseline: 0.015, loudSince: 0, quietSince: 0, lastEventAt: 0,
  startedAt: 0, stopTimer: null, running: false, recog: null, lastTranscript: ''
};

const AMBIENT_SENS = { low: 4.6, medium: 3.2, high: 2.2 };
const CONFLICT_WORDS = ['shout', 'yell', 'screaming', 'stop it', 'shut up', 'angry', 'argument', 'fighting', 'calm down', 'get out', 'idiot', 'useless'];

function ambientPill() {
  let el = $('#ambientPill');
  if (!el) {
    el = document.createElement('div');
    el.className = 'ambient-pill';
    el.id = 'ambientPill';
    el.hidden = true;
    el.innerHTML = `<span class="ap-dot"></span>
      <span class="ap-text">LISTENING</span>
      <span class="ap-time" id="ambientTime">15:00</span>
      <button class="ap-stop" data-act="stopAmbient" aria-label="Stop listening">${ICO.close}</button>`;
    document.body.appendChild(el);
  }
  return el;
}

async function startAmbient() {
  if (AMBIENT.running) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('This browser cannot reach the microphone.', 'red', ICO.lock);
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const Ctx = window.AudioContext || window.webkitAudioContext;
    AMBIENT.ctx = new Ctx();
    const src = AMBIENT.ctx.createMediaStreamSource(stream);
    AMBIENT.analyser = AMBIENT.ctx.createAnalyser();
    AMBIENT.analyser.fftSize = 1024;
    AMBIENT.analyser.smoothingTimeConstant = 0.4;
    src.connect(AMBIENT.analyser);
    AMBIENT.buf = new Uint8Array(AMBIENT.analyser.fftSize);
    AMBIENT.stream = stream;
    AMBIENT.running = true;
    AMBIENT.startedAt = Date.now();
    AMBIENT.lastEventAt = 0;
    AMBIENT.loudSince = 0;
    AMBIENT.quietSince = 0;
    AMBIENT.baseline = 0.015;
    S.ambient.enabled = true;
    save();

    const pill = ambientPill();
    pill.hidden = false;
    document.body.classList.add('ambient-on');
    const mins = Number(S.ambient.minutes) || 15;
    if (AMBIENT.stopTimer) clearInterval(AMBIENT.stopTimer);
    AMBIENT.stopTimer = setInterval(() => {
      const left = Math.max(0, Math.round((mins * 60000 - (Date.now() - AMBIENT.startedAt)) / 1000));
      const t = $('#ambientTime');
      if (t) t.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0');
      if (left <= 0) stopAmbient('Session finished — nothing was kept.');
    }, 1000);

    AMBIENT.raf = requestAnimationFrame(ambientLoop);
    if (S.ambient.words) startWords();
    toast('Listening locally. Nothing is recorded.', 'green', ICO.pulse);
    refresh();
  } catch (err) {
    console.warn(err);
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    toast(denied ? 'Microphone blocked — allow it in your browser settings.' : 'No microphone found on this device.', 'red', ICO.lock);
    stopAmbient(null);
  }
}

function stopAmbient(msg) {
  AMBIENT.running = false;
  if (AMBIENT.raf) cancelAnimationFrame(AMBIENT.raf);
  AMBIENT.raf = 0;
  if (AMBIENT.stopTimer) { clearInterval(AMBIENT.stopTimer); AMBIENT.stopTimer = null; }
  if (AMBIENT.recog) { try { AMBIENT.recog.stop(); } catch (e) {} AMBIENT.recog = null; }
  if (AMBIENT.stream) { AMBIENT.stream.getTracks().forEach(t => t.stop()); AMBIENT.stream = null; }
  if (AMBIENT.ctx) { try { AMBIENT.ctx.close(); } catch (e) {} AMBIENT.ctx = null; }
  S.ambient.enabled = false;
  save();
  const pill = $('#ambientPill');
  if (pill) pill.hidden = true;
  document.body.classList.remove('ambient-on');
  if (msg) toast(msg, 'info', ICO.pulse);
  if (currentScreen === 'sanctuary') RENDER.sanctuary();
}

function ambientLoop() {
  if (!AMBIENT.running) return;
  const an = AMBIENT.analyser;
  if (!an) return;
  an.getByteTimeDomainData(AMBIENT.buf);
  let sum = 0;
  for (let i = 0; i < AMBIENT.buf.length; i++) {
    const v = (AMBIENT.buf[i] - 128) / 128;
    sum += v * v;
  }
  const rms = Math.sqrt(sum / AMBIENT.buf.length);
  const now = Date.now();

  // first two seconds calibrate the room
  if (now - AMBIENT.startedAt < 2000) {
    AMBIENT.baseline = Math.max(0.008, AMBIENT.baseline * 0.8 + rms * 0.2);
  } else {
    AMBIENT.baseline = Math.max(0.006, AMBIENT.baseline * 0.998 + rms * 0.002);
  }

  const mult = AMBIENT_SENS[S.ambient.sensitivity] || 3.2;
  const threshold = Math.max(0.055, AMBIENT.baseline * mult);
  const quietLine = Math.max(0.004, AMBIENT.baseline * 0.55);

  const meter = $('#ambientMeter');
  if (meter) meter.style.width = Math.min(100, (rms / (threshold * 1.6)) * 100) + '%';

  if (rms > threshold) {
    if (!AMBIENT.loudSince) AMBIENT.loudSince = now;
    AMBIENT.quietSince = 0;
    const held = now - AMBIENT.loudSince;
    if (held > 900 && now - AMBIENT.lastEventAt > 18000) {
      AMBIENT.lastEventAt = now;
      AMBIENT.loudSince = 0;
      ambientEvent(held > 2600 ? 'shout' : 'spike', rms);
    }
  } else {
    AMBIENT.loudSince = 0;
    if (!AMBIENT.quietSince) AMBIENT.quietSince = now;
    if (now - AMBIENT.quietSince > 90000 && rms < quietLine && now - AMBIENT.lastEventAt > 60000) {
      AMBIENT.lastEventAt = now;
      AMBIENT.quietSince = now;
      ambientEvent('quiet', rms);
    }
  }
  AMBIENT.raf = requestAnimationFrame(ambientLoop);
}

function startWords() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast('This browser has no speech recognition — sound sensing only.', 'info', ICO.mic || ICO.pulse);
    return;
  }
  try {
    const r = new SR();
    r.continuous = true;
    r.interimResults = true;
    r.lang = 'en-IN';
    r.onresult = (ev) => {
      let text = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) text += ev.results[i][0].transcript + ' ';
      text = text.trim();
      if (!text) return;
      const low = text.toLowerCase();
      const hit = CONFLICT_WORDS.some(w => low.indexOf(w) >= 0);
      if (hit && Date.now() - AMBIENT.lastEventAt > 18000) {
        AMBIENT.lastEventAt = Date.now();
        AMBIENT.lastTranscript = text;
        ambientEvent('shout', 0);
        AMBIENT.lastTranscript = '';
      }
    };
    r.onerror = () => {};
    r.onend = () => { if (AMBIENT.running && S.ambient.words) { try { r.start(); } catch (e) {} } };
    r.start();
    AMBIENT.recog = r;
  } catch (err) {
    console.warn(err);
  }
}
