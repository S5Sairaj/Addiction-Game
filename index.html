const BGM = { el: null, url: null, db: null };

function bgmEl() {
  if (!BGM.el) {
    const a = document.createElement('audio');
    a.id = 'bgmAudio';
    a.loop = S.music.loop !== false;
    a.volume = S.music.volume === undefined ? 0.6 : S.music.volume;
    a.preload = 'auto';
    document.body.appendChild(a);
    a.addEventListener('play', renderMusicUI);
    a.addEventListener('pause', renderMusicUI);
    a.addEventListener('ended', renderMusicUI);
    BGM.el = a;
  }
  return BGM.el;
}
function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open('wlgq-media', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, val) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put(val, key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readonly');
    const req = tx.objectStore('files').get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbDel(key) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').delete(key);
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error);
  });
}

function setupMusic() {
  bgmEl();
  if (!$('#bgmDock')) {
    const dock = document.createElement('div');
    dock.className = 'bgm-dock';
    dock.id = 'bgmDock';
    dock.hidden = true;
    dock.innerHTML = `<button class="bgm-toggle" id="bgmToggle" data-act="toggleMusic" aria-label="Play or pause your music"></button>
      <span class="bgm-bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="bgm-title" id="bgmTitle"></span>`;
    document.body.appendChild(dock);
  }
  if (!$('#musicFile')) {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'audio/*,.mp3,.m4a,.ogg,.wav,.aac';
    input.id = 'musicFile';
    input.hidden = true;
    input.addEventListener('change', () => {
      const f = input.files && input.files[0];
      input.value = '';
      if (f) chooseTrack(f);
    });
    document.body.appendChild(input);
  }
  loadStoredTrack();
  resumeMusicOnGesture();
  renderMusicUI();
}
async function loadStoredTrack() {
  try {
    const blob = await idbGet('bgm');
    if (blob && blob.size) {
      setTrackFromBlob(blob, S.music.name || 'Your track', false);
      renderMusicUI();
    } else if (S.music.hasTrack) {
      S.music.hasTrack = false;
      save();
      renderMusicUI();
    }
  } catch (err) {
    console.warn('Stored music could not be loaded.', err);
  }
}
function setTrackFromBlob(blob, name, persist) {
  const a = bgmEl();
  if (BGM.url) URL.revokeObjectURL(BGM.url);
  BGM.url = URL.createObjectURL(blob);
  a.src = BGM.url;
  S.music.hasTrack = true;
  S.music.name = name || 'Your track';
  if (persist !== false) save();
  renderMusicUI();
}
async function chooseTrack(file) {
  if (!file) return;
  if (file.size > 25 * 1024 * 1024) {
    toast('That file is over 25 MB — pick something smaller.', 'red', ICO.lock);
    return;
  }
  const name = file.name.replace(/\.[^.]+$/, '');
  setTrackFromBlob(file, name, true);
  S.music.enabled = true;
  save();
  try { await idbPut('bgm', file); } catch (err) { console.warn('Music could not be stored for next time.', err); }
  playTrack();
  toast(`${name} — playing. It will be here next time too.`, 'gold', ICO.music);
  renderMusicUI();
}
function playTrack() {
  const a = bgmEl();
  if (!a.src) { toast('Choose a track first.', 'red', ICO.music); return; }
  const p = a.play();
  if (p && p.catch) p.catch(() => {
    S.music.enabled = true;
    save();
    toast('The browser blocked playback — tap play once more.', 'red', ICO.music);
  });
  S.music.enabled = true;
  save();
  setTimeout(renderMusicUI, 60);
}
function pauseTrack() {
  const a = bgmEl();
  a.pause();
  S.music.enabled = false;
  save();
  renderMusicUI();
}
function toggleTrack() {
  const a = bgmEl();
  if (!S.music.hasTrack || !a.src) { toast('Choose an MP3 in Settings first.', 'info', ICO.music); go('settings'); return; }
  if (a.paused) playTrack(); else pauseTrack();
}
function setMusicVolume(v) {
  const val = Math.max(0, Math.min(1, v));
  S.music.volume = val;
  const a = bgmEl();
  a.volume = val;
  save();
  renderMusicUI();
}
function setMusicLoop(on) {
  S.music.loop = !!on;
  bgmEl().loop = !!on;
  save();
  refresh();
}
function clearTrack() {
  confirmDialog({
    title: 'Remove this track?',
    body: '<p class="small" style="line-height:1.6">The file is deleted from this device. Your game progress is untouched.</p>',
    confirmLabel: 'Remove it',
    onConfirm: async () => {
      const a = bgmEl();
      a.pause();
      a.removeAttribute('src');
      a.load();
      if (BGM.url) { URL.revokeObjectURL(BGM.url); BGM.url = null; }
      S.music.hasTrack = false;
      S.music.name = '';
      S.music.enabled = false;
      save();
      try { await idbDel('bgm'); } catch (err) {}
      renderMusicUI();
      refresh();
      toast('Track removed.', 'info', ICO.music);
    }
  });
}
function resumeMusicOnGesture() {
  if (!S.music || !S.music.enabled) return;
  const kick = () => {
    window.removeEventListener('pointerdown', kick);
    window.removeEventListener('keydown', kick);
    if (S.music.hasTrack && bgmEl().src) playTrack();
  };
  window.addEventListener('pointerdown', kick);
  window.addEventListener('keydown', kick);
}
function renderMusicUI() {
  const a = BGM.el;
  const playing = !!(a && a.src && !a.paused);
  const dock = $('#bgmDock');
  if (dock) {
    dock.hidden = !S.music.hasTrack;
    dock.classList.toggle('playing', playing);
    const t = $('#bgmTitle');
    if (t) t.textContent = S.music.name || 'Your track';
    const btn = $('#bgmToggle');
    if (btn) btn.innerHTML = playing ? ICO.pause : ICO.play;
  }
  const state = $('#musicState');
  if (state) state.textContent = !S.music.hasTrack ? 'NO TRACK' : playing ? 'PLAYING' : 'PAUSED';
  const toggle = $('#musicToggleBtn');
  if (toggle) {
    toggle.disabled = !S.music.hasTrack;
    toggle.textContent = playing ? 'PAUSE' : 'PLAY';
  }
  const rm = $('#musicRemoveBtn');
  if (rm) rm.disabled = !S.music.hasTrack;
  const nm = $('#musicName');
  if (nm) nm.textContent = S.music.hasTrack ? (S.music.name || 'Your track') : 'No track chosen';
  const sub = $('#musicSub');
  if (sub) sub.textContent = S.music.hasTrack ? 'Stored on this device' : 'MP3, M4A, OGG or WAV · up to 25 MB';
}

function toggleSetting(key) {

function exportSave() {
  const data = JSON.stringify(S, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `wlgq-save-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Save exported.', 'green', ICO.down);
}

function importSave() {
  const input = $('#importFile');
  input.value = '';
  input.click();
}

document.addEventListener('change', (ev) => {
  if (ev.target && ev.target.id === 'importFile') {
    const file = ev.target.files && ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result));
        if (!data || typeof data !== 'object' || !data.player) throw new Error('Not a WLGQ save file.');
        confirmDialog({
          title: 'Load this save?',
          body: `<p class="small">This replaces your current progress on this device with the file <b>${esc(file.name)}</b>.</p>
            <p class="small muted mt">Save version ${esc(String(data.version || 'unknown'))} · level ${esc(String((data.player && data.player.level) || '?'))}</p>`,
          confirmLabel: 'Load save',
          danger: false,
          onConfirm: () => {
            S = deepMerge(freshState(), data);
            migrate();
            rollover();
            save();
            renderShell();
            go('home');
            toast('Save loaded.', 'green', ICO.up);
          }
        });
      } catch (err) {
        toast('That file could not be read as a WLGQ save.', 'red', ICO.close);
        console.warn(err);
      }
    };
    reader.readAsText(file);
  }
});

function mgImpulse() {
  const stage = $('#mgStage');
  if (!MG.data) MG.data = shuffle(IMPULSE_SCENARIOS.slice());
  const sc = MG.data[MG.i];
  if (!sc) return finishGame({ xp: 40 + MG.score * 12, coins: 10 + MG.score * 4, score: MG.score, label: MG.score + ' / ' + (MG.data.length * 2) });
  stage.innerHTML = `
    <div class="stage-head">
      <span class="chip blue">SCENARIO ${MG.i + 1} / ${MG.data.length}</span>
      <span class="chip gold">INTENTION ${MG.score}</span>
    </div>
    <div class="notif-card" style="min-height:auto;display:block">${sc.s}</div>
    <div class="chart-title">What do you do?</div>
    ${sc.opts.map((o, i) => `<button class="chal-opt" data-imp="${i}">${o.t}</button>`).join('')}
    ${MG.log.length ? `<div class="log mt-s">${MG.log.slice(-3).reverse().map(l => `<div class="l-you">${esc(l)}</div>`).join('')}</div>` : ''}`;

  $$('[data-imp]', stage).forEach(btn => {
    btn.addEventListener('click', () => {
      const o = sc.opts[Number(btn.dataset.imp)];
      MG.score += o.score;
      MG.log.push(o.fb);
      MG.i += 1;
      if (o.score === 0) Sound.fail(); else Sound.reward();
      mgImpulse();
    });
  });
}

function mgFocusPaint() {
  const stage = $('#mgStage');
  const f = MG.focus;
  if (!stage || !f) return;
  const pct = Math.min(100, ((f.total - f.left) / f.total) * 100);
  const cellCount = 20;
  const lit = Math.min(cellCount - 1, Math.floor(((f.total - f.left) / f.total) * cellCount));
  stage.innerHTML = `
    <div class="stage-head">
      <span class="chip blue">${esc(f.activity).toUpperCase()}</span>
      <span class="chip gold">${f.minutes} MIN</span>
    </div>
    <div class="timer-big" id="fdTimer">${String(Math.floor(f.left / 60)).padStart(2, '0')}:${String(f.left % 60).padStart(2, '0')}</div>
    <div class="bar green"><i id="fdBar" style="width:${pct}%"></i></div>
    <div class="dungeon" id="fdDungeon">${Array.from({ length: cellCount }, (_, i) => `<span class="dg-cell ${i <= lit ? 'on' : ''}"></span>`).join('')}</div>
    <div class="btn-row">
      <button class="btn ghost" data-fdpause="1">${f.paused ? 'RESUME' : 'PAUSE'}</button>
      <button class="btn danger" data-fdend="1">END SESSION</button>
    </div>
    <p class="tiny muted mt">Leaving early is allowed. You keep whatever time you did.</p>`;

  stopMgTimer();
  mgInterval = setInterval(() => {
    const t = $('#fdTimer');
    if (!t) { stopMgTimer(); return; }
    if (f.paused) return;
    f.left -= 1;
    t.textContent = `${String(Math.floor(Math.max(0, f.left) / 60)).padStart(2, '0')}:${String(Math.max(0, f.left) % 60).padStart(2, '0')}`;
    const bar = $('#fdBar');
    if (bar) bar.style.width = Math.min(100, ((f.total - f.left) / f.total) * 100) + '%';
    const cells = $$('#fdDungeon .dg-cell');
    const idx = Math.min(cells.length - 1, Math.floor(((f.total - f.left) / f.total) * cells.length));
    cells.forEach((c, i) => c.classList.toggle('on', i <= idx));
    if (f.left <= 0) {
      stopMgTimer();
      const doneMin = f.minutes;
      f.running = false;
      S.stats.focusSessions += 1;
      S.stats.focusMinutes += doneMin;
      S.daily.focus += 1;
      S.focusHistory.push({ date: todayStr(), minutes: doneMin, activity: f.activity, at: Date.now() });
      bumpQuestEvent('focus');
      if (doneMin >= 25) bumpQuestEvent('deep_focus');
      if (S.grand.started && !S.grand.objectives[2]) {
        S.grand.objectives[2] = true;
        S.grand.answers.focusNote = doneMin + ' minutes on "' + f.activity + '"';
        checkGrandComplete();
      }
      Sound.reward();
      finishGame({ xp: focusXp(doneMin * 10), coins: Math.round(doneMin * 2), score: doneMin, label: doneMin + ' MIN' });
      toast(doneMin + ' minutes focused on ' + f.activity + '.', 'green', ICO.flame);
      MG.focus = null;
    }
  }, 1000);

  $('[data-fdpause]', stage).addEventListener('click', (e) => {
    f.paused = !f.paused;
    e.currentTarget.textContent = f.paused ? 'RESUME' : 'PAUSE';
  });
  $('[data-fdend]', stage).addEventListener('click', () => {
    stopMgTimer();
    const done = Math.round((f.total - f.left) / 60);
    f.running = false;
    if (done >= 1) {
      S.stats.focusSessions += 1;
      S.stats.focusMinutes += done;
      S.daily.focus += 1;
      S.focusHistory.push({ date: todayStr(), minutes: done, activity: f.activity, at: Date.now() });
      bumpQuestEvent('focus');
      MG.focus = null;
      finishGame({ xp: focusXp(done * 10), coins: done * 2, score: done, label: done + ' MIN' });
    } else {
      MG.focus = null;
      MG.kind = null;
      toast('Session ended. No penalty — start again whenever.', 'info', ICO.heart);
      refresh();
    }
  });
}

function mgNotifRun(seconds) {
  stopMgTimer();
  const pool = shuffle(NOTIF_POOL.slice()).slice(0, 10);
  let i = 0, score = 0, combo = 0, bestCombo = 0, right = 0, wrong = 0, left = seconds;
  const stage = $('#mgStage');

  const draw = () => {
    const n = pool[i];
    left = seconds;
    stage.innerHTML = `
      <div class="stage-head">
        <span class="chip blue">${i + 1} / 10</span>
        <span class="chip gold">SCORE ${score}</span>
        <span class="chip ${combo > 1 ? 'green' : ''}">COMBO ×${Math.max(1, combo)}</span>
        <span class="chip crimson" id="nTime">${left}s</span>
      </div>
      <div class="bar crimson"><i id="nBar" style="width:100%"></i></div>
      <div class="notif-card mt">
        <div style="flex:1">
          <span class="app">${n.app}</span>
          ${n.text}
        </div>
      </div>
      <div class="btn-row">
        <button class="btn sm primary" data-nc="important">IMPORTANT</button>
        <button class="btn sm ghost" data-nc="wait">CAN WAIT</button>
        <button class="btn sm ghost" data-nc="unnecessary">UNNECESSARY</button>
      </div>
      <p class="tiny muted mt">${right} correct · ${wrong} missed</p>`;

    $$('[data-nc]', stage).forEach(b => b.addEventListener('click', () => answer(b.dataset.nc)));
    stopMgTimer();
    mgInterval = setInterval(() => {
      left -= 1;
      const tEl = $('#nTime');
      if (!tEl) { stopMgTimer(); return; }
      tEl.textContent = Math.max(0, left) + 's';
      const bar = $('#nBar');
      if (bar) bar.style.width = Math.max(0, (left / seconds) * 100) + '%';
      if (left <= 0) { stopMgTimer(); answer(null); }
    }, 1000);
  };

  const answer = (choice) => {
    stopMgTimer();
    const n = pool[i];
    const ok = choice === n.cat;
    if (ok) { score += 10 + combo * 2; combo += 1; bestCombo = Math.max(bestCombo, combo); right += 1; Sound.reward(); }
    else { combo = 0; wrong += 1; Sound.fail(); }
    i += 1;
    if (i >= pool.length) {
      const xp = 40 + score;
      finishGame({ xp, coins: 10 + Math.round(score / 3), score, label: score + ' PTS' });
      return;
    }
    draw();
  };
  draw();
}

/* ---------- 5. Infinite Maze ---------- */
const MAZE_N = 11;
function genMaze() {
  const g = Array.from({ length: MAZE_N }, () => Array(MAZE_N).fill(1));
  const stack = [[1, 1]];
  g[1][1] = 0;
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const dirs = shuffle([[2, 0], [-2, 0], [0, 2], [0, -2]]);
    let moved = false;
    for (const [dx, dy] of dirs) {
      const nx = x + dx, ny = y + dy;
      if (nx > 0 && ny > 0 && nx < MAZE_N - 1 && ny < MAZE_N - 1 && g[ny][nx] === 1) {
        g[y + dy / 2][x + dx / 2] = 0;
        g[ny][nx] = 0;
        stack.push([nx, ny]);
        moved = true;
        break;
      }
    }
    if (!moved) stack.pop();
  }
  // decorate open cells
  const open = [];
  for (let y = 1; y < MAZE_N - 1; y++) for (let x = 1; x < MAZE_N - 1; x++) if (g[y][x] === 0) open.push([x, y]);
  const deco = open.filter(([x, y]) => !(x === 1 && y === 1) && !(x === MAZE_N - 2 && y === MAZE_N - 2));
  const shuffled = shuffle(deco);
  const traps = shuffled.slice(0, 4).map(p => p.join(','));
  const crystals = shuffled.slice(4, 9).map(p => p.join(','));
  return { g, traps, crystals, exit: [MAZE_N - 2, MAZE_N - 2] };
}

let mazeState = null;
function mgMazeRun() {
  const stage = $('#mgStage');
  const m = genMaze();
  mazeState = { ...m, px: 1, py: 1, crystals: new Set(m.crystals), steps: 0, got: 0, start: Date.now() };
  drawMaze();
  function drawMaze() {
    const st = mazeState;
    const cells = [];
    for (let y = 0; y < MAZE_N; y++) {
      for (let x = 0; x < MAZE_N; x++) {
        let cls = st.g[y][x] === 1 ? 'wall' : '';
        const key = x + ',' + y;
        if (st.traps.includes(key)) cls = 'trap';
        if (st.crystals.has(key)) cls = 'crys';
        if (x === st.exit[0] && y === st.exit[1]) cls = 'exit';
        if (x === st.px && y === st.py) cls = 'me';
        cells.push(`<div class="mz ${cls}"></div>`);
      }
    }
    stage.innerHTML = `
      <div class="stage-head">
        <span class="chip blue">STEPS ${st.steps}</span>
        <span class="chip gold">CRYSTALS ${st.got}</span>
        <button class="btn sm ghost" data-mzquit="1">QUIT</button>
      </div>
      <div class="maze" id="mazeGrid" style="grid-template-columns:repeat(${MAZE_N},1fr)">${cells.join('')}</div>
      <div class="dpad">
        <button data-mv="up">${ICO.up}</button><button data-mv="quit" style="visibility:hidden"></button><button data-mv="reset">${ICO.close}</button>
        <button data-mv="left">${ICO.left}</button><button data-mv="down">${ICO.down}</button><button data-mv="right">${ICO.right}</button>
      </div>`;
    $$('[data-mv]', stage).forEach(b => b.addEventListener('click', () => {
      const v = b.dataset.mv;
      if (v === 'reset') return mgMazeRun();
      if (v === 'quit') return mgExit();
      move(v);
    }));
    const quit = $('[data-mzquit]', stage);
    if (quit) quit.addEventListener('click', mgExit);
  }
  function move(dir) {
    const st = mazeState;
    const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[dir];
    if (!d) return;
    const nx = st.px + d[0], ny = st.py + d[1];
    if (nx < 0 || ny < 0 || nx >= MAZE_N || ny >= MAZE_N) return;
    if (st.g[ny][nx] === 1) return;
    st.steps += 1;
    const key = nx + ',' + ny;
    if (st.crystals.has(key)) { st.crystals.delete(key); st.got += 1; Sound.reward(); }
    if (st.traps.includes(key)) {
      Sound.fail();
      st.px = 1; st.py = 1;
      toast('A distraction trap — back to the start of the corridor.', 'red', ICO.skull);
      drawMaze();
      return;
    }
    st.px = nx; st.py = ny;
    if (nx === st.exit[0] && ny === st.exit[1]) {
      const score = Math.max(10, 100 - st.steps + st.got * 15);
      finishGame({ xp: 40 + st.got * 10, coins: 10 + st.got * 3, score, label: 'EXIT FOUND' });
      return;
    }
    drawMaze();
  }
  mazeState.move = move;
}

function startMotes() {
  const canvas = $('#motes');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, dpr = Math.min(2, window.devicePixelRatio || 1);
  const dots = [];
  const count = 34;

  function size() {
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function seed() {
    dots.length = 0;
    for (let i = 0; i < count; i++) {
      dots.push({
        x: Math.random() * w, y: Math.random() * h,
        r: 0.6 + Math.random() * 1.6,
        vy: -(0.08 + Math.random() * 0.25),
        vx: (Math.random() - 0.5) * 0.12,
        a: 0.12 + Math.random() * 0.35
      });
    }
  }
  function frame() {
    if (!S.settings.animations || S.settings.reducedMotion) {
      ctx.clearRect(0, 0, w, h);
      return;
    }
    ctx.clearRect(0, 0, w, h);
    dots.forEach(d => {
      d.x += d.vx; d.y += d.vy;
      if (d.y < -6) { d.y = h + 6; d.x = Math.random() * w; }
      if (d.x < -6) d.x = w + 6;
      if (d.x > w + 6) d.x = -6;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(120,190,255,${d.a})`;
      ctx.fill();
    });
    requestAnimationFrame(frame);
  }

  size(); seed(); frame();
  window.addEventListener('resize', () => { size(); seed(); });
}


/* =========================================================================
   Countermeasure setup — inline on Home, no pop-ups
   ========================================================================= */
const SETUP_DISTRACTIONS = [
  'Short videos and reels',
  'Social media scrolling',
  'Gaming',
  'Series and streaming',
  'Notifications',
  'Procrastinating on one big task',
  'Avoiding something specific'
];
const SETUP_SEL = { d: '' };

function setupCardHtml() {
  const prof = S.profile || {};
  const sel = SETUP_SEL.d || prof.distraction || '';
  return `<div class="panel mt counter-panel setup-card">
    <div class="panel-head"><div class="panel-title">${ICO.target} Set up your countermeasure</div><span class="chip">2 QUESTIONS</span></div>
    <p class="small muted" style="line-height:1.6">Right here on the page — no pop-ups. Thirty seconds now, and every quest afterwards has something to be measured against.</p>
    <div class="chart-title mt">1 · What takes the most from you?</div>
    <div class="setup-chips" id="setupChips">
      ${SETUP_DISTRACTIONS.map(d => `<button class="chip ${sel === d ? 'gold' : ''}" data-act="setupPick" data-setup="${esc(d)}">${esc(d)}</button>`).join('')}
    </div>
    <div class="chart-title mt">2 · What will you do instead, in that exact moment?</div>
    <input class="setup-input" id="setupRepl" maxlength="90" placeholder="Walk to the balcony for five minutes, no phone." value="${esc(prof.replacement || '')}">
    <div class="btn-row mt-s">
      <button class="btn primary" data-act="saveSetup">SAVE</button>
      <button class="btn ghost" data-act="setupProof">PROVE IT — 5 MIN</button>
    </div>
  </div>`;
}

function saveSetup(refreshAfter) {
  const sel = SETUP_SEL.d || (S.profile && S.profile.distraction) || '';
  const el = $('#setupRepl');
  const repl = ((el && el.value) || (S.profile && S.profile.replacement) || '').trim();
  if (!sel) { toast('Pick the thing that takes the most from you.', 'red', ICO.lock); return false; }
  if (repl.length < 6) { toast('Name something specific you could do at 11 pm.', 'red', ICO.lock); return false; }
  S.profile = S.profile || {};
  S.profile.distraction = sel;
  S.profile.replacement = repl;
  S.profile.ritualStarted = true;
  S.profile.ritualDone = true;
  if (!S.grand.objectives[0]) {
    S.grand.objectives[0] = true;
    S.grand.answers.distraction = sel;
    S.grand.started = true;
  }
  save();
  if (refreshAfter) {
    refresh();
    toast('Countermeasure set — it is pinned on the command centre.', 'green', ICO.check);
  }
  return true;
}

function startProof() {
  MG.prefill = { activity: (S.profile && S.profile.replacement) || '', minutes: 5 };
  openMiniGame('focus');
}

/* ------------------------------------------------------------------ keyboard escape */
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') closeModal();
});
</script>
