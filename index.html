<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090B10">
<meta name="description" content="World Level Grand Quest — a dark-fantasy RPG that turns real habits into progression.">
<title>WLGQ — War Against the Supreme Leaders of Addictions</title>
<style>
/* =========================================================================
   WLGQ — WAR AGAINST THE SUPREME LEADERS OF ADDICTIONS
   Dark-fantasy RPG interface. Mobile-first. Vanilla CSS3 only.
   ========================================================================= */

:root{
  --bg-0:#090B10;
  --bg-1:#101827;
  --panel:#162131;
  --panel-2:#1b2740;
  --blue:#43B7FF;
  --gold:#D8B15C;
  --crimson:#E54848;
  --purple:#9B70E8;
  --green:#55D69A;
  --text:#F1F4F9;
  --muted:#A5B1C2;
  --border:rgba(120,160,210,.16);
  --border-strong:rgba(120,160,210,.30);
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 18px 40px -22px rgba(0,0,0,.95);
  --glow-blue:0 0 0 1px rgba(67,183,255,.35), 0 0 24px -6px rgba(67,183,255,.45);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --topbar-h:58px;
  --nav-h:66px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font);
  color:var(--text);
  background:
    radial-gradient(1100px 620px at 80% -10%, rgba(67,183,255,.10), transparent 60%),
    radial-gradient(900px 520px at -10% 110%, rgba(155,112,232,.10), transparent 60%),
    linear-gradient(180deg,#090B10 0%,#0c121c 45%,#090B10 100%);
  background-attachment:fixed;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  padding-top:calc(var(--topbar-h) + var(--safe-t));
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:650;letter-spacing:.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
::selection{background:rgba(67,183,255,.3)}

/* light theme variant (Settings → Dark mode off) */
body.theme-parchment{
  --bg-0:#eae4d8; --bg-1:#f4efe4; --panel:#fbf7ee; --panel-2:#f1e9d9;
  --text:#1b2230; --muted:#5a6577; --border:rgba(40,60,90,.16); --border-strong:rgba(40,60,90,.3);
  background:
    radial-gradient(1000px 600px at 80% -10%, rgba(67,183,255,.16), transparent 60%),
    linear-gradient(180deg,#f6f1e6,#e9e2d4 60%,#f2ecdf);
}
body.theme-parchment .panel,
body.theme-parchment .card{box-shadow:0 14px 30px -24px rgba(20,30,50,.7)}

/* parchment surfaces — every dark container becomes a light one */
body.theme-parchment .panel,
body.theme-parchment .game-stage,
body.theme-parchment .mg-card,
body.theme-parchment .quest-card,
body.theme-parchment .boss-card,
body.theme-parchment .item,
body.theme-parchment .deco,
body.theme-parchment .title-row,
body.theme-parchment .ach,
body.theme-parchment .skill-node,
body.theme-parchment .eq-slot,
body.theme-parchment .loc,
body.theme-parchment .quick,
body.theme-parchment .tile,
body.theme-parchment .dstat,
body.theme-parchment .notif-card,
body.theme-parchment .chal-opt,
body.theme-parchment .skill-btn,
body.theme-parchment .filter,
body.theme-parchment .toast,
body.theme-parchment .modal,
body.theme-parchment .mg-art{
  background:linear-gradient(165deg,#fffdf8,#f4ecdc);
  border-color:rgba(40,60,90,.18);
  color:#1b2230;
}
body.theme-parchment .mg-art{
  background:radial-gradient(circle at 50% 130%,rgba(67,183,255,.22),transparent 65%),linear-gradient(160deg,#fbf7ee,#ece3d2);
}
body.theme-parchment .hero{
  background:
    radial-gradient(120% 130% at 88% -10%, rgba(67,183,255,.18), transparent 55%),
    radial-gradient(90% 100% at 0% 110%, rgba(155,112,232,.14), transparent 60%),
    linear-gradient(160deg,#fdfaf3,#efe7d8 65%,#f6f0e4);
  border-color:rgba(40,60,90,.22);
}
body.theme-parchment .threat{
  background:radial-gradient(120% 130% at 100% 0%, rgba(229,72,72,.16), transparent 60%),linear-gradient(160deg,#fdf6f2,#f4e9e2);
  border-color:rgba(229,72,72,.32);
}
body.theme-parchment .threat-name{color:#8d2020}
body.theme-parchment .battle-arena{
  background:
    radial-gradient(80% 60% at 50% 0%, rgba(229,72,72,.14), transparent 60%),
    linear-gradient(180deg,#fdf5f4,#f4ebe6 60%,#fbf6ee);
  border-color:rgba(229,72,72,.3);
}
body.theme-parchment .map-wrap{
  background:
    radial-gradient(70% 50% at 20% 12%, rgba(67,183,255,.14), transparent 60%),
    radial-gradient(60% 50% at 85% 78%, rgba(155,112,232,.12), transparent 60%),
    linear-gradient(170deg,#fdfaf3,#f1e9da 60%,#faf4e9);
}
body.theme-parchment .map-wrap svg.paths path{stroke:rgba(60,90,130,.35)}
body.theme-parchment .sanct{
  background:radial-gradient(circle at 50% 0%,rgba(67,183,255,.14),transparent 60%),linear-gradient(170deg,#fdfaf3,#f0e8d9);
  border-color:rgba(40,60,90,.18);
}
body.theme-parchment .sanct .s-art{color:#8a6a24}
body.theme-parchment .log{
  background:rgba(255,253,247,.85);border-color:rgba(40,60,90,.18);
}
body.theme-parchment .log .l-boss{color:#a42b2b}
body.theme-parchment .log .l-you{color:#1f6f9c}
body.theme-parchment .log .l-win{color:#8a6a24}
body.theme-parchment .bar{background:rgba(40,60,90,.12);border-color:rgba(40,60,90,.08)}
body.theme-parchment .dungeon .dg-cell{background:rgba(40,60,90,.12)}
body.theme-parchment .switch{background:rgba(40,60,90,.12)}
body.theme-parchment .switch i{background:#8a94a5}
body.theme-parchment .cur{background:rgba(40,60,90,.05);border-color:rgba(40,60,90,.18)}
body.theme-parchment .icon-btn{background:rgba(40,60,90,.04);border-color:rgba(40,60,90,.18);color:#4d5868}
body.theme-parchment .btn.ghost{background:rgba(40,60,90,.03)}
body.theme-parchment .chip{background:rgba(40,60,90,.05);border-color:rgba(40,60,90,.18);color:#4d5868}
body.theme-parchment .side-item:hover{background:rgba(40,60,90,.06)}
body.theme-parchment .eq-slot{border-color:rgba(40,60,90,.28)}
body.theme-parchment .modal-back{background:rgba(30,38,52,.55)}
body.theme-parchment .brand-name{color:#1b2230}
body.theme-parchment .mz{background:#e4dbc9}
body.theme-parchment .mz.wall{background:#b9ab92}
body.theme-parchment .mz.me{background:#1b2230;box-shadow:none}
body.theme-parchment .attr-top b,body.theme-parchment .hero-stats b,body.theme-parchment .dstat b{color:#1b2230}
body.theme-parchment .screen-title{color:#121826}

/* ---------- atmospheric background ---------- */
.atmos{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.atmos-glow{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
.atmos-glow.g1{width:420px;height:420px;top:-140px;right:-120px;background:radial-gradient(circle,rgba(67,183,255,.22),transparent 70%)}
.atmos-glow.g2{width:460px;height:460px;bottom:-180px;left:-160px;background:radial-gradient(circle,rgba(155,112,232,.2),transparent 70%)}
#motes{width:100%;height:100%;opacity:.55}

/* ---------- top bar ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:60;
  height:calc(var(--topbar-h) + var(--safe-t));
  padding:var(--safe-t) 12px 0;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(180deg,rgba(9,11,16,.96),rgba(9,11,16,.72) 70%,rgba(9,11,16,0));
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
body.theme-parchment .topbar{background:linear-gradient(180deg,rgba(246,241,230,.97),rgba(246,241,230,.8) 70%,rgba(246,241,230,0))}
.brand{display:flex;align-items:center;gap:9px;padding:4px;border-radius:12px}
.brand-rune{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
  color:var(--blue);
  background:linear-gradient(160deg,rgba(67,183,255,.2),rgba(67,183,255,.04));
  border:1px solid rgba(67,183,255,.32);
  box-shadow:inset 0 0 12px -4px rgba(67,183,255,.6);
  flex:0 0 auto;
}
.brand-text{display:flex;flex-direction:column;line-height:1;text-align:left}
.brand-name{font-family:var(--serif);font-size:17px;letter-spacing:.14em;color:var(--text)}
.brand-sub{font-size:8px;letter-spacing:.2em;color:var(--muted);margin-top:3px}
.topbar-right{display:flex;align-items:center;gap:6px;min-width:0}
.currency-bar{display:flex;gap:5px;overflow:hidden}
.cur{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;padding:5px 7px;border-radius:9px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.cur svg{width:12px;height:12px;flex:0 0 auto}
.cur.coin{color:var(--gold);border-color:rgba(216,177,92,.3);background:rgba(216,177,92,.08)}
.cur.crystal{color:var(--blue);border-color:rgba(67,183,255,.28);background:rgba(67,183,255,.07)}
.cur.shadow{color:var(--purple);border-color:rgba(155,112,232,.3);background:rgba(155,112,232,.08)}
.cur.transc{color:var(--crimson);border-color:rgba(229,72,72,.3);background:rgba(229,72,72,.08)}
.cur.energy{color:var(--green);border-color:rgba(85,214,154,.3);background:rgba(85,214,154,.08)}
.icon-btn{
  position:relative;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  color:var(--muted);border:1px solid var(--border);background:rgba(255,255,255,.03);
  transition:color .18s,border-color .18s,transform .12s;
}
.icon-btn:hover{color:var(--text);border-color:var(--border-strong)}
.icon-btn:active{transform:scale(.94)}
.icon-btn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--crimson);box-shadow:0 0 8px var(--crimson)}

/* ---------- sidebar ---------- */
.sidebar{display:none}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:11px 12px;border-radius:11px;color:var(--muted);
  font-size:13.5px;font-weight:550;letter-spacing:.04em;text-align:left;
  border:1px solid transparent;transition:.16s;
}
.side-item svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.side-item:hover{color:var(--text);background:rgba(255,255,255,.045)}
.side-item.active{
  color:var(--text);
  background:linear-gradient(90deg,rgba(67,183,255,.16),rgba(67,183,255,.03));
  border-color:rgba(67,183,255,.28);
  box-shadow:inset 3px 0 0 var(--blue);
}
.side-item.active svg{color:var(--blue);opacity:1}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;border:1px dashed var(--border);color:var(--muted);font-size:11px;line-height:1.5}
.side-tier{font-family:var(--serif);letter-spacing:.1em;color:var(--gold);font-size:11px;margin-bottom:4px}

/* ---------- bottom nav ---------- */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  height:calc(var(--nav-h) + var(--safe-b));
  padding:0 6px var(--safe-b);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:linear-gradient(0deg,rgba(9,11,16,.98),rgba(16,24,39,.92));
  border-top:1px solid var(--border);
  backdrop-filter:blur(16px);
}
body.theme-parchment .bottomnav{background:linear-gradient(0deg,rgba(246,241,230,.99),rgba(240,233,220,.95))}
.bn-item{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  height:100%;color:var(--muted);font-size:9.5px;letter-spacing:.09em;font-weight:600;
  position:relative;transition:color .16s;
}
.bn-item svg{width:21px;height:21px}
.bn-item.active{color:var(--blue)}
.bn-item.active::before{
  content:"";position:absolute;top:0;width:26px;height:2px;border-radius:0 0 3px 3px;
  background:var(--blue);box-shadow:0 0 12px var(--blue);
}
.bn-item:active{transform:scale(.95)}

/* ---------- screens / layout ---------- */
#screens{max-width:1240px;margin:0 auto;padding:14px 12px 8px}
.screen{display:none;animation:fadeUp .32s ease both}
.screen.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 14px;flex-wrap:wrap}
.screen-title{font-family:var(--serif);font-size:20px;letter-spacing:.08em;text-transform:uppercase}
.screen-sub{font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.03em;max-width:60ch}
.eyebrow{font-size:9.5px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;font-weight:700}

/* ---------- panels / cards ---------- */
.panel{
  background:linear-gradient(165deg,rgba(27,39,64,.92),rgba(22,33,49,.92));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;
}
.panel::after{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.045),transparent 34%);
}
.panel.tight{padding:11px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.panel-title{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px}
.panel-title svg{width:14px;height:14px;color:var(--blue)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:11.5px}
.tiny{font-size:10.5px}
.gold{color:var(--gold)}.blue{color:var(--blue)}.green{color:var(--green)}.crimson{color:var(--crimson)}.purple{color:var(--purple)}
.center{text-align:center}
.mt{margin-top:12px}.mt-s{margin-top:8px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:42px;padding:0 16px;border-radius:12px;
  font-size:12.5px;font-weight:650;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--border-strong);color:var(--text);
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  transition:transform .12s,box-shadow .2s,border-color .2s,filter .2s;
  white-space:nowrap;
}
.btn:hover{border-color:rgba(67,183,255,.5);box-shadow:0 0 20px -8px rgba(67,183,255,.7)}
.btn:active{transform:translateY(1px) scale(.995)}
.btn svg{width:15px;height:15px}
.btn.primary{
  background:linear-gradient(180deg,#4cc0ff,#2b8fd6);border-color:rgba(67,183,255,.7);color:#04121d;
  box-shadow:0 10px 26px -14px rgba(67,183,255,.95),inset 0 1px 0 rgba(255,255,255,.35);
}
.btn.primary:hover{filter:brightness(1.07)}
.btn.gold{background:linear-gradient(180deg,#e7c878,#b78f3f);border-color:rgba(216,177,92,.75);color:#231a06;box-shadow:0 10px 26px -14px rgba(216,177,92,.9)}
.btn.danger{background:linear-gradient(180deg,#ef6060,#b83232);border-color:rgba(229,72,72,.7);color:#fff;box-shadow:0 10px 26px -14px rgba(229,72,72,.9)}
.btn.ghost{background:rgba(255,255,255,.02)}
.btn.sm{min-height:34px;padding:0 11px;font-size:10.5px;border-radius:9px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- bars ---------- */
.bar{position:relative;height:9px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.bar > i{
  display:block;height:100%;border-radius:6px;width:0;
  background:linear-gradient(90deg,#2b8fd6,#43B7FF);
  transition:width .8s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 0 12px -2px rgba(67,183,255,.8);
}
.bar.gold > i{background:linear-gradient(90deg,#b78f3f,#D8B15C);box-shadow:0 0 12px -2px rgba(216,177,92,.8)}
.bar.green > i{background:linear-gradient(90deg,#2f9c70,#55D69A);box-shadow:0 0 12px -2px rgba(85,214,154,.8)}
.bar.purple > i{background:linear-gradient(90deg,#6d48b8,#9B70E8);box-shadow:0 0 12px -2px rgba(155,112,232,.8)}
.bar.crimson > i{background:linear-gradient(90deg,#a92f2f,#E54848);box-shadow:0 0 12px -2px rgba(229,72,72,.8)}
.bar.xp{height:11px}
.bar.xp > i{background:linear-gradient(90deg,#43B7FF,#9B70E8 60%,#D8B15C)}
.bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:.06em;margin-bottom:5px;font-variant-numeric:tabular-nums}

/* ---------- pills / chips ---------- */
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:999px;font-size:10px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--border);color:var(--muted);background:rgba(255,255,255,.03);white-space:nowrap;
}
.chip.blue{color:var(--blue);border-color:rgba(67,183,255,.35);background:rgba(67,183,255,.1)}
.chip.gold{color:var(--gold);border-color:rgba(216,177,92,.35);background:rgba(216,177,92,.1)}
.chip.green{color:var(--green);border-color:rgba(85,214,154,.35);background:rgba(85,214,154,.1)}
.chip.crimson{color:var(--crimson);border-color:rgba(229,72,72,.35);background:rgba(229,72,72,.1)}
.chip.purple{color:var(--purple);border-color:rgba(155,112,232,.35);background:rgba(155,112,232,.1)}
.chip.solid{background:rgba(67,183,255,.16);color:var(--blue)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{
  padding:7px 12px;border-radius:999px;font-size:10.5px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--border);color:var(--muted);background:rgba(255,255,255,.025);white-space:nowrap;
}
.filter.active{color:#04121d;background:linear-gradient(180deg,#4cc0ff,#2b8fd6);border-color:transparent}

/* ============ HOME ============ */
.hero{
  border-radius:20px;padding:0;overflow:hidden;position:relative;
  border:1px solid var(--border-strong);
  background:
    radial-gradient(120% 130% at 88% -10%, rgba(67,183,255,.24), transparent 55%),
    radial-gradient(90% 100% at 0% 110%, rgba(155,112,232,.2), transparent 60%),
    linear-gradient(160deg,#1a2740,#101827 60%,#0b1220);
  box-shadow:var(--shadow);
}
.hero-inner{padding:15px 14px 14px;position:relative;z-index:2}
.hero-top{display:flex;gap:13px;align-items:center}
.avatar-wrap{position:relative;flex:0 0 auto}
.avatar{
  width:76px;height:76px;border-radius:18px;position:relative;overflow:visible;
  border:1px solid rgba(67,183,255,.45);
  background:linear-gradient(160deg,#1d2c46,#0d1522);
  box-shadow:0 0 0 1px rgba(9,11,16,.6),0 12px 26px -16px rgba(67,183,255,.9);
  display:grid;place-items:center;
}
.avatar-art{position:absolute;inset:0;border-radius:18px;overflow:hidden;display:block}
.avatar-art svg{width:100%;height:100%}
.avatar .lvl-badge{
  position:absolute;right:-6px;bottom:-6px;min-width:26px;height:26px;padding:0 5px;border-radius:9px;
  display:grid;place-items:center;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;
  color:#04121d;background:linear-gradient(180deg,#e7c878,#c39b45);border:1px solid rgba(9,11,16,.7);
  box-shadow:0 4px 12px -4px rgba(0,0,0,.9);
}
.hero-id{min-width:0;flex:1}
.hero-name{font-family:var(--serif);font-size:18px;letter-spacing:.06em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-title{font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase;margin-top:4px}
.hero-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.hero-xp{margin-top:13px}
.hero-stats{display:flex;gap:14px;margin-top:11px;flex-wrap:wrap}
.hstat{font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.hstat b{display:block;font-size:13px;letter-spacing:.02em;color:var(--text);margin-top:3px;font-variant-numeric:tabular-nums}

.attr-list{display:grid;gap:9px;grid-template-columns:1fr}
.attr{display:grid;gap:4px}
.attr-top{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.attr-top b{color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:0}
.attr-top .eq{color:var(--green);font-size:9.5px;margin-left:4px}

.threat{
  border-radius:var(--radius);padding:13px;border:1px solid rgba(229,72,72,.3);position:relative;overflow:hidden;
  background:radial-gradient(120% 130% at 100% 0%, rgba(229,72,72,.22), transparent 60%),linear-gradient(160deg,#221a24,#141a28);
}
.threat-name{font-family:var(--serif);font-size:15px;letter-spacing:.04em;line-height:1.3;color:#ffd9d9}
.threat-orb{
  width:46px;height:46px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,rgba(229,72,72,.9),rgba(90,16,16,.9));
  box-shadow:0 0 22px -4px rgba(229,72,72,.8);color:#ffe3e3;
  animation:pulse 3.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{box-shadow:0 0 18px -6px rgba(229,72,72,.7)}50%{box-shadow:0 0 30px -2px rgba(229,72,72,.95)}}

.quest-mini{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border)}
.quest-mini:last-child{border-bottom:0;padding-bottom:0}
.qm-check{
  width:19px;height:19px;border-radius:6px;flex:0 0 auto;margin-top:1px;border:1px solid var(--border-strong);
  display:grid;place-items:center;font-size:10px;color:transparent;
}
.qm-check.done{background:rgba(85,214,154,.18);border-color:rgba(85,214,154,.6);color:var(--green)}
.qm-body{min-width:0;flex:1}
.qm-name{font-size:12.5px;font-weight:600}
.qm-meta{font-size:10px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
.qm-rew{font-size:10px;color:var(--gold);white-space:nowrap;letter-spacing:.04em}

.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.quick{
  display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;text-align:left;
  border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:11.5px;font-weight:600;line-height:1.25;
  transition:.16s;min-height:52px;
}
.quick:hover{border-color:rgba(67,183,255,.45);background:rgba(67,183,255,.08)}
.quick svg{width:16px;height:16px;color:var(--blue);flex:0 0 auto}

.daily-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dstat{padding:10px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.025)}
.dstat b{display:block;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dstat span{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* collapsible */
.collapse-head{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.collapse-head .caret{transition:transform .25s;color:var(--muted);font-size:11px}
.collapse.open .caret{transform:rotate(180deg)}
.collapse-body{display:none;margin-top:11px}
.collapse.open .collapse-body{display:block}

/* ============ WORLD MAP ============ */
.map-wrap{position:relative;border-radius:20px;border:1px solid var(--border-strong);overflow:hidden;
  background:
    radial-gradient(70% 50% at 20% 12%, rgba(67,183,255,.16), transparent 60%),
    radial-gradient(60% 50% at 85% 78%, rgba(155,112,232,.16), transparent 60%),
    radial-gradient(50% 40% at 50% 45%, rgba(216,177,92,.07), transparent 70%),
    linear-gradient(170deg,#0e1626,#0a1018 60%,#0d1524);
  box-shadow:inset 0 0 90px -30px rgba(67,183,255,.35);
}
.map-canvas{position:relative;height:940px}
.map-canvas svg.paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tier-node{
  position:absolute;transform:translate(-50%,-50%);
  width:92px;display:flex;flex-direction:column;align-items:center;gap:7px;
  text-align:center;z-index:3;
}
.tier-orb{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
  font-family:var(--serif);font-size:17px;letter-spacing:0;
  border:1px solid var(--border-strong);
  background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));
  color:var(--muted);position:relative;transition:.2s;
}
.tier-node.available .tier-orb{
  color:#04121d;background:linear-gradient(180deg,#5cc8ff,#2b8fd6);border-color:rgba(67,183,255,.8);
  box-shadow:0 0 0 4px rgba(67,183,255,.14),0 0 26px -6px rgba(67,183,255,.95);
  animation:orbFloat 4s ease-in-out infinite;
}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.tier-node.cleared .tier-orb{
  color:#231a06;background:linear-gradient(180deg,#efd08a,#c39b45);border-color:rgba(216,177,92,.8);
  box-shadow:0 0 22px -8px rgba(216,177,92,.9);
}
.tier-node.locked .tier-orb{filter:grayscale(.35);opacity:.9}
.tier-label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.tier-node.available .tier-label,.tier-node.cleared .tier-label{color:var(--text)}
.tier-pct{font-size:9px;color:var(--blue);font-variant-numeric:tabular-nums}
.tier-node.cleared .tier-pct{color:var(--gold)}
.map-legend{display:flex;gap:12px;flex-wrap:wrap;padding:10px 12px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);letter-spacing:.06em}
.legend-dot{width:8px;height:8px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

.loc-grid{display:grid;grid-template-columns:1fr;gap:10px}
.loc{
  display:flex;gap:11px;align-items:center;padding:11px;border-radius:13px;text-align:left;
  border:1px solid var(--border);background:linear-gradient(140deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  transition:.16s;
}
.loc:hover{border-color:rgba(67,183,255,.45);transform:translateY(-1px)}
.loc-art{
  width:44px;height:44px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;color:var(--blue);
  border:1px solid var(--border);background:radial-gradient(circle at 30% 25%,rgba(67,183,255,.22),rgba(9,11,16,.5));
}
.loc-art svg{width:20px;height:20px}
.loc-name{font-size:12.5px;font-weight:600}
.loc-desc{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45}

/* ============ BATTLE ============ */
.battle-arena{
  border-radius:20px;padding:14px;position:relative;overflow:hidden;
  border:1px solid rgba(229,72,72,.26);
  background:
    radial-gradient(80% 60% at 50% 0%, rgba(229,72,72,.22), transparent 60%),
    linear-gradient(180deg,#1a1220,#0c111c 60%,#090d15);
  box-shadow:inset 0 0 100px -40px rgba(229,72,72,.55);
}
.boss-row{display:flex;gap:12px;align-items:center}
.boss-portrait{
  width:78px;height:78px;border-radius:20px;flex:0 0 auto;position:relative;display:grid;place-items:center;
  border:1px solid rgba(229,72,72,.5);overflow:hidden;
  background:radial-gradient(circle at 35% 28%,rgba(229,72,72,.95),rgba(52,8,14,.98) 70%);
  box-shadow:0 0 34px -10px rgba(229,72,72,.95);
}
.boss-portrait svg{width:40px;height:40px;color:#ffdede;opacity:.92}
.boss-portrait.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-3px,-1px)}}
.boss-name{font-family:var(--serif);font-size:15px;line-height:1.25;letter-spacing:.03em}
.boss-hpbar{height:14px;margin-top:9px}
.boss-hpbar > i{background:linear-gradient(90deg,#8e1f1f,#E54848 60%,#ff7b7b)}
.phase-track{display:flex;gap:4px;margin-top:9px}
.phase-seg{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.09);position:relative}
.phase-seg.on{background:linear-gradient(90deg,#E54848,#ff9a9a);box-shadow:0 0 10px -2px rgba(229,72,72,.9)}
.phase-labels{display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.1em;color:var(--muted);margin-top:5px;text-transform:uppercase}

.energy{display:flex;align-items:center;gap:8px;margin-top:11px}
.mini-avatar{width:34px;height:34px;border-radius:10px;overflow:hidden;flex:0 0 auto;border:1px solid var(--border-strong);background:#0b1220}
.energy .bar{flex:1}
.skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.skill-btn{
  display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:12px;text-align:left;
  border:1px solid var(--border-strong);background:linear-gradient(160deg,rgba(67,183,255,.12),rgba(255,255,255,.02));
  transition:.16s;min-height:64px;
}
.skill-btn:hover{border-color:rgba(67,183,255,.65);box-shadow:0 0 22px -12px rgba(67,183,255,.95)}
.skill-btn b{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--blue)}
.skill-btn span{font-size:9.5px;color:var(--muted);line-height:1.35}
.skill-btn.cool{opacity:.45;pointer-events:none}
.skill-btn.wide{grid-column:span 2}

.log{
  margin-top:12px;max-height:172px;overflow-y:auto;border-radius:12px;padding:10px;
  border:1px solid var(--border);background:rgba(6,9,14,.55);font-size:11.5px;line-height:1.6;
  display:flex;flex-direction:column;gap:5px;scrollbar-width:thin;
}
.log .l-boss{color:#ff9d9d}
.log .l-you{color:#9fdcff}
.log .l-sys{color:var(--muted);font-size:10.5px;letter-spacing:.05em}
.log .l-win{color:var(--gold)}

.boss-card{
  padding:12px;border-radius:14px;border:1px solid var(--border);text-align:left;
  background:linear-gradient(150deg,rgba(255,255,255,.05),rgba(255,255,255,.012));transition:.16s;
}
.boss-card:hover{border-color:rgba(229,72,72,.45)}
.boss-card .bc-top{display:flex;gap:10px;align-items:center}
.bc-orb{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;color:#ffdede;
  background:radial-gradient(circle at 35% 28%,rgba(229,72,72,.85),rgba(52,8,14,.95));border:1px solid rgba(229,72,72,.4)}
.bc-orb svg{width:18px;height:18px}
.bc-name{font-size:11.5px;font-weight:650;line-height:1.3}
.bc-meta{font-size:9.5px;color:var(--muted);margin-top:3px;letter-spacing:.06em}
.bc-def{font-size:9px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}

.chal-opt{
  display:block;width:100%;text-align:left;padding:12px;border-radius:12px;margin-bottom:8px;
  border:1px solid var(--border);background:rgba(255,255,255,.03);font-size:12.5px;line-height:1.45;
  transition:.14s;
}
.chal-opt:hover{border-color:rgba(67,183,255,.5);background:rgba(67,183,255,.07)}
.chal-opt.good{border-color:rgba(85,214,154,.7);background:rgba(85,214,154,.13)}
.chal-opt.bad{border-color:rgba(229,72,72,.7);background:rgba(229,72,72,.12)}
.chal-opt small{display:block;color:var(--muted);font-size:10.5px;margin-top:4px}

/* ============ QUESTS ============ */
.quest-card{
  padding:12px;border-radius:14px;border:1px solid var(--border);
  background:linear-gradient(150deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  display:grid;gap:9px;
}
.quest-card.done{border-color:rgba(85,214,154,.35);background:linear-gradient(150deg,rgba(85,214,154,.1),rgba(255,255,255,.012))}
.qc-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qc-title{font-size:13px;font-weight:650;line-height:1.3}
.qc-desc{font-size:11px;color:var(--muted);line-height:1.5}
.qc-rew{display:flex;gap:6px;flex-wrap:wrap}
.qc-foot{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ============ INVENTORY ============ */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.item{
  position:relative;padding:9px 7px;border-radius:13px;border:1px solid var(--border);
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;transition:.16s;min-height:112px;
}
.item:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.item .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border)}
.item .ico svg{width:20px;height:20px}
.item .nm{font-size:10px;line-height:1.3;font-weight:600;letter-spacing:.01em}
.item .rar{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.item .qty{position:absolute;top:5px;right:6px;font-size:9.5px;font-weight:700;color:var(--text);background:rgba(0,0,0,.45);padding:1px 5px;border-radius:6px}
.item .eqmark{position:absolute;top:5px;left:6px;font-size:7.5px;letter-spacing:.08em;color:#04121d;background:var(--blue);padding:1px 4px;border-radius:5px;font-weight:800}
.item.locked{opacity:.5}
.item.locked::after{content:"";position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(45deg,rgba(0,0,0,.18) 0 6px,transparent 6px 12px)}
.rar-common{color:#A5B1C2}.rar-rare{color:#43B7FF}.rar-epic{color:#9B70E8}.rar-legendary{color:#D8B15C}.rar-transcendent{color:#E54848}
.item.r-common{border-color:rgba(165,177,194,.28)}
.item.r-rare{border-color:rgba(67,183,255,.35);box-shadow:inset 0 0 26px -18px rgba(67,183,255,.9)}
.item.r-epic{border-color:rgba(155,112,232,.42);box-shadow:inset 0 0 26px -16px rgba(155,112,232,.9)}
.item.r-legendary{border-color:rgba(216,177,92,.5);box-shadow:inset 0 0 30px -16px rgba(216,177,92,.95)}
.item.r-transcendent{border-color:rgba(229,72,72,.55);box-shadow:inset 0 0 34px -14px rgba(229,72,72,.95)}
.eq-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eq-slot{padding:9px;border-radius:12px;border:1px dashed var(--border-strong);text-align:center;font-size:9.5px;color:var(--muted);letter-spacing:.08em}
.eq-slot b{display:block;font-size:10.5px;color:var(--text);margin-top:5px;letter-spacing:0;font-weight:600}

/* ============ MINI-GAMES ============ */
.mg-card{
  border-radius:16px;border:1px solid var(--border);overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(255,255,255,.012));
  display:flex;flex-direction:column;
}
.mg-art{height:82px;display:grid;place-items:center;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 130%,rgba(67,183,255,.35),transparent 65%),linear-gradient(160deg,#16233a,#0b1220)}
.mg-art svg{width:34px;height:34px;color:var(--blue);opacity:.9}
.mg-art .mg-num{position:absolute;top:8px;left:10px;font-size:9px;letter-spacing:.18em;color:var(--muted)}
.mg-body{padding:11px;display:flex;flex-direction:column;gap:8px;flex:1}
.mg-name{font-size:13px;font-weight:650;letter-spacing:.03em}
.mg-desc{font-size:10.5px;color:var(--muted);line-height:1.5;flex:1}

.game-stage{
  border-radius:16px;border:1px solid var(--border);padding:14px;
  background:linear-gradient(170deg,#101a2b,#0a0f18);
}
.stage-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.timer-big{font-family:var(--serif);font-size:40px;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-align:center;color:var(--blue)}
.dungeon{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:12px 0}
.dg-cell{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.05)}
.dg-cell.on{background:linear-gradient(180deg,#43B7FF,#2b8fd6);box-shadow:0 0 8px -1px rgba(67,183,255,.9)}
.dg-cell.lit{background:linear-gradient(180deg,#efd08a,#c39b45)}
.notif-card{
  padding:12px;border-radius:13px;border:1px solid var(--border);background:rgba(255,255,255,.05);
  font-size:12.5px;line-height:1.5;margin-bottom:10px;min-height:64px;display:flex;gap:9px;align-items:center;
}
.notif-card .app{font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:3px}
.tl-row{display:grid;grid-template-columns:52px 1fr;gap:9px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:11.5px;align-items:center}
.tl-row:last-child{border-bottom:0}
.tl-time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:10.5px}
.tl-row.hot{color:#ffc9c9}
.maze{display:grid;gap:2px;margin:10px auto;max-width:340px;touch-action:none}
.mz{aspect-ratio:1;border-radius:2px;background:#0a111c}
.mz.wall{background:#2b3a57}
.mz.trap{background:rgba(229,72,72,.55)}
.mz.crys{background:rgba(67,183,255,.75);box-shadow:0 0 8px rgba(67,183,255,.8)}
.mz.exit{background:linear-gradient(135deg,#55D69A,#2f9c70);box-shadow:0 0 12px rgba(85,214,154,.8)}
.mz.me{background:#F1F4F9;box-shadow:0 0 10px rgba(241,244,249,.9)}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin-top:10px}
.dpad button{border-radius:10px;border:1px solid var(--border-strong);background:rgba(255,255,255,.05);font-size:16px;display:grid;place-items:center}
.dpad button:active{background:rgba(67,183,255,.2)}
.result-box{text-align:center;padding:16px 10px}
.result-box .big{font-family:var(--serif);font-size:30px;letter-spacing:.04em;color:var(--gold);margin:6px 0}

/* ============ SKILLS ============ */
.branch{margin-bottom:14px}
.branch-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.branch-name{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.branch-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border-strong),transparent)}
.skill-nodes{display:flex;flex-direction:column;gap:0}
.skill-node{
  display:flex;gap:11px;align-items:flex-start;padding:10px;border-radius:12px;text-align:left;
  border:1px solid var(--border);background:rgba(255,255,255,.025);transition:.16s;width:100%;
}
.skill-node + .skill-node{margin-top:16px;position:relative}
.skill-node + .skill-node::before{
  content:"";position:absolute;left:26px;top:-16px;width:2px;height:16px;
  background:var(--border-strong);
}
.skill-node.unlocked{border-color:rgba(85,214,154,.4);background:linear-gradient(140deg,rgba(85,214,154,.12),rgba(255,255,255,.02));box-shadow:0 0 22px -16px rgba(85,214,154,.95)}
.skill-node.available{border-color:rgba(67,183,255,.45)}
.skill-node.locked{opacity:.62}
.sn-orb{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font-size:11px;font-weight:800;
  border:1px solid var(--border-strong);background:rgba(255,255,255,.04);color:var(--muted);
}
.skill-node.unlocked .sn-orb{background:linear-gradient(180deg,#55D69A,#2f9c70);color:#04140d;border-color:transparent;box-shadow:0 0 16px -4px rgba(85,214,154,.9)}
.skill-node.available .sn-orb{color:var(--blue);border-color:rgba(67,183,255,.6);box-shadow:0 0 16px -6px rgba(67,183,255,.9)}
.sn-body{min-width:0;flex:1}
.sn-name{display:block;font-size:12px;font-weight:650}
.sn-desc{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.45}
.sn-req{display:block;font-size:9.5px;color:var(--gold);margin-top:4px;letter-spacing:.03em}
.sn-lvl{display:block;font-size:9px;letter-spacing:.1em;color:var(--green);margin-top:4px}

/* ============ SANCTUARY ============ */
.sanct-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.sanct{
  position:relative;border-radius:14px;border:1px solid var(--border);overflow:hidden;
  min-height:104px;display:flex;flex-direction:column;justify-content:flex-end;padding:9px;text-align:left;
  background:radial-gradient(circle at 50% 0%,rgba(67,183,255,.18),transparent 60%),linear-gradient(170deg,#16233a,#0a1018);
  transition:.18s;
}
.sanct:hover{border-color:rgba(216,177,92,.5);transform:translateY(-2px)}
.sanct .s-art{position:absolute;top:8px;left:50%;transform:translateX(-50%);color:var(--gold);opacity:.85}
.sanct .s-art svg{width:26px;height:26px}
.sanct .s-name{font-size:10.5px;font-weight:650;letter-spacing:.04em;position:relative}
.sanct .s-state{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:3px;position:relative}
.sanct.locked{opacity:.55}
.deco-list{display:grid;gap:8px}
.deco{display:flex;gap:9px;align-items:center;padding:9px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.025)}
.deco .d-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(216,177,92,.12);color:var(--gold);flex:0 0 auto}
.deco .d-ico svg{width:16px;height:16px}
.deco .d-name{font-size:11.5px;font-weight:600}
.deco .d-req{font-size:9.5px;color:var(--muted);margin-top:2px}

/* ============ STATS ============ */
.stat-tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{padding:11px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.03)}
.tile b{display:block;font-size:18px;font-variant-numeric:tabular-nums;font-family:var(--serif)}
.tile span{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.chart-box{margin-top:12px}
.chart-title{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.chart-svg{width:100%;height:auto;overflow:visible}
.chart-svg .grid-l{stroke:rgba(255,255,255,.08);stroke-width:1}
.chart-svg .axis-t{fill:#A5B1C2;font-size:9px;letter-spacing:.06em}
.chart-svg .bar-r{fill:url(#gradBar)}
.chart-svg .bar-g{fill:url(#gradGold)}
.chart-svg .bar-p{fill:url(#gradPurple)}
.chart-svg .ln{fill:none;stroke:#43B7FF;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart-svg .pt{fill:#43B7FF}

/* ============ PROFILE ============ */
.prof-hero{display:flex;gap:13px;align-items:center}
.prof-avatar{width:88px;height:88px;border-radius:20px;overflow:hidden;border:1px solid rgba(216,177,92,.45);
  background:linear-gradient(160deg,#1d2c46,#0d1522);flex:0 0 auto;box-shadow:0 0 30px -14px rgba(216,177,92,.9)}
.title-list{display:grid;gap:7px}
.title-row{display:flex;gap:9px;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:11px;
  border:1px solid var(--border);background:rgba(255,255,255,.025);font-size:11.5px}
.title-row.on{border-color:rgba(216,177,92,.5);background:rgba(216,177,92,.1)}
.ach-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach{padding:10px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.025);text-align:center}
.ach .a-ico{width:34px;height:34px;margin:0 auto 7px;border-radius:50%;display:grid;place-items:center;
  border:1px solid var(--border-strong);color:var(--muted);background:rgba(255,255,255,.04)}
.ach.on .a-ico{color:#231a06;background:linear-gradient(180deg,#efd08a,#c39b45);border-color:transparent;box-shadow:0 0 18px -6px rgba(216,177,92,.95)}
.ach .a-name{font-size:10px;font-weight:650;line-height:1.3}
.ach .a-desc{font-size:9px;color:var(--muted);margin-top:3px;line-height:1.35}
.ach.locked{opacity:.6}

/* ============ MODAL / TOAST / OVERLAY ============ */
.modal-root{position:fixed;inset:0;z-index:120;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal-root[hidden]{display:none}
.modal-back{position:absolute;inset:0;background:rgba(4,7,12,.72);backdrop-filter:blur(6px);animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  position:relative;z-index:2;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  border-radius:20px 20px 0 0;border:1px solid var(--border-strong);border-bottom:0;
  background:linear-gradient(170deg,#1a2740,#111a29 70%,#0d1420);
  padding:16px 15px calc(18px + var(--safe-b));
  box-shadow:0 -20px 60px -20px rgba(0,0,0,.95);
  animation:sheetUp .3s cubic-bezier(.2,.9,.25,1) both;
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
body.theme-parchment .modal{background:linear-gradient(170deg,#fdf9f0,#f3ecdd)}
.modal-grab{width:38px;height:4px;border-radius:3px;background:var(--border-strong);margin:0 auto 12px}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.modal-title{font-family:var(--serif);font-size:17px;letter-spacing:.04em;line-height:1.25}
.modal-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--border);display:grid;place-items:center;color:var(--muted);flex:0 0 auto;font-size:15px}
.modal-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal-actions .btn{flex:1}

.toast-stack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + var(--safe-b) + 12px);z-index:110;
  display:flex;flex-direction:column;gap:7px;width:min(94vw,430px);pointer-events:none}
.toast{
  display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:12px;font-size:11.5px;line-height:1.45;
  border:1px solid var(--border-strong);background:rgba(22,33,49,.97);backdrop-filter:blur(10px);
  box-shadow:0 14px 30px -16px rgba(0,0,0,.95);animation:toastIn .28s cubic-bezier(.2,.9,.25,1) both;pointer-events:none;
}
.toast.out{animation:toastOut .25s ease forwards}
.toast .t-ico{width:18px;height:18px;flex:0 0 auto;color:var(--blue);margin-top:1px}
.toast.gold{border-color:rgba(216,177,92,.45)}.toast.gold .t-ico{color:var(--gold)}
.toast.green{border-color:rgba(85,214,154,.45)}.toast.green .t-ico{color:var(--green)}
.toast.red{border-color:rgba(229,72,72,.45)}.toast.red .t-ico{color:var(--crimson)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-6px)}}

.overlay-root{position:fixed;inset:0;z-index:300;pointer-events:none}
.overlay-root > *{pointer-events:auto}
.levelup{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:auto;
  background:
    radial-gradient(circle at 50% 45%,rgba(216,177,92,.28),rgba(216,177,92,.05) 45%,transparent 66%),
    rgba(4,7,12,.95);
  backdrop-filter:blur(6px);
  animation:fadeIn .3s both;padding:20px;
}
.lu-card{text-align:center;max-width:340px;animation:luPop .6s cubic-bezier(.2,1.3,.3,1) both}
@keyframes luPop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
.lu-eyebrow{font-size:10px;letter-spacing:.35em;color:var(--gold);text-transform:uppercase}
.lu-level{font-family:var(--serif);font-size:64px;line-height:1;color:var(--text);text-shadow:0 0 40px rgba(216,177,92,.75);margin:6px 0 2px}
.lu-sub{font-size:12px;color:var(--muted);letter-spacing:.06em}
.lu-rewards{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.lu-skip{margin-top:18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border-strong);padding-bottom:2px}

/* breathing / recovery */
.breathe{width:150px;height:150px;margin:14px auto;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(85,214,154,.4);background:radial-gradient(circle,rgba(85,214,154,.22),transparent 70%);
  color:var(--green);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  animation:breathe 8s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.86);opacity:.75}50%{transform:scale(1.06);opacity:1}}
.field{display:grid;gap:5px;margin-bottom:10px}
.field label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{
  width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--border-strong);
  background:rgba(6,9,14,.5);color:var(--text);font-size:12.5px;
}
body.theme-parchment .field input,body.theme-parchment .field select,body.theme-parchment .field textarea{background:#fff}
.field textarea{min-height:64px;resize:vertical;line-height:1.5}
.field input::placeholder,.field textarea::placeholder{color:rgba(165,177,194,.65)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:0}
.toggle-row .tr-name{font-size:12px;font-weight:550}
.toggle-row .tr-desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4}
.switch{width:44px;height:25px;border-radius:999px;border:1px solid var(--border-strong);background:rgba(255,255,255,.06);position:relative;flex:0 0 auto;transition:.2s}
.switch i{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--muted);transition:.2s}
.switch.on{background:rgba(67,183,255,.3);border-color:rgba(67,183,255,.7)}
.switch.on i{left:21px;background:var(--blue);box-shadow:0 0 10px rgba(67,183,255,.9)}

.buildstamp{text-align:center;font-size:9px;color:rgba(165,177,194,.55);letter-spacing:.08em;padding:14px 0 4px}

/* reduced motion */
body.no-anim *,body.no-anim *::before,body.no-anim *::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
}

/* narrow phones: keep the top bar from crowding */
@media (max-width:619px){
  .cur.shadow,.cur.transc{display:none}
}
@media (max-width:420px){
  .brand-sub{display:none}
  .cur{font-size:10px;padding:4px 6px;gap:3px}
  .cur svg{width:11px;height:11px}
  .topbar-right{gap:5px}
}

/* ---------- tablet ---------- */
@media (min-width:620px){
  #screens{padding:18px 18px 8px}
  .g2{grid-template-columns:1fr 1fr}
  .attr-list{grid-template-columns:1fr 1fr}
  .quick-grid{grid-template-columns:repeat(3,1fr)}
  .daily-grid{grid-template-columns:repeat(4,1fr)}
  .loc-grid{grid-template-columns:1fr 1fr}
  .skill-grid{grid-template-columns:repeat(3,1fr)}
  .sanct-grid{grid-template-columns:repeat(3,1fr)}
  .stat-tiles{grid-template-columns:repeat(4,1fr)}
  .ach-grid{grid-template-columns:repeat(3,1fr)}
  .modal-root{align-items:center;padding:20px}
  .modal{border-radius:20px;border-bottom:1px solid var(--border-strong);max-height:86vh;padding:18px}
  .toast-stack{bottom:20px}
  .avatar{width:86px;height:86px}
  .hero-name{font-size:20px}
  .map-canvas{height:820px}
}

/* ---------- desktop ---------- */
@media (min-width:1000px){
  body{padding-bottom:20px;padding-left:238px}
  .bottomnav{display:none}
  .sidebar{
    display:flex;flex-direction:column;gap:6px;
    position:fixed;top:calc(var(--topbar-h) + var(--safe-t));left:0;bottom:0;width:238px;z-index:55;
    padding:14px 12px 16px;border-right:1px solid var(--border);
    background:linear-gradient(180deg,rgba(13,19,30,.96),rgba(9,11,16,.98));
    backdrop-filter:blur(12px);
  }
  body.theme-parchment .sidebar{background:linear-gradient(180deg,rgba(248,243,232,.98),rgba(240,233,220,.99))}
  .topbar{padding-left:calc(238px + 16px)}
  #screens{padding:22px 24px 20px;max-width:1180px}
  .g2{grid-template-columns:1.15fr .85fr}
  .screen-title{font-size:23px}
  .quick-grid{grid-template-columns:repeat(3,1fr)}
  .hero-inner{padding:18px}
  .map-canvas{height:760px}
  .skill-grid{grid-template-columns:repeat(3,1fr)}
  .toast-stack{bottom:24px}
  .inv-grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr))}
}
@media (min-width:1280px){
  .hero-inner{padding:22px}
  .avatar{width:96px;height:96px}
}


/* ============ opening ritual ============ */
.ritual{
  position:fixed;inset:0;z-index:320;display:flex;align-items:center;justify-content:center;
  pointer-events:auto;
  padding:24px 18px calc(24px + var(--safe-b));overflow-y:auto;
  background:
    radial-gradient(70% 50% at 50% 0%, rgba(67,183,255,.16), transparent 60%),
    radial-gradient(60% 50% at 50% 100%, rgba(155,112,232,.14), transparent 60%),
    #070a10;
  animation:fadeIn .35s both;
}
.ritual-card{width:100%;max-width:430px;text-align:center}
.ritual-dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.ritual-dot{width:24px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);transition:.3s}
.ritual-dot.on{background:var(--blue);box-shadow:0 0 10px rgba(67,183,255,.9)}
.ritual-eyebrow{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.ritual-title{font-family:var(--serif);font-size:24px;line-height:1.28;letter-spacing:.01em;margin:10px 0 8px;color:var(--text)}
.ritual-sub{font-size:12.5px;line-height:1.65;color:var(--muted);max-width:38ch;margin:0 auto}
.ritual-opts{display:grid;gap:8px;margin-top:20px;text-align:left}
.ritual-opt{
  padding:13px 14px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.04);font-size:13px;line-height:1.45;text-align:left;color:var(--text);
  transition:.15s;
}
.ritual-opt:hover{border-color:rgba(67,183,255,.5);background:rgba(67,183,255,.09)}
.ritual-opt.sel{border-color:rgba(67,183,255,.7);background:rgba(67,183,255,.14);box-shadow:0 0 20px -10px rgba(67,183,255,.9)}
.ritual-input{
  width:100%;min-height:86px;margin-top:16px;padding:12px;border-radius:12px;
  border:1px solid var(--border-strong);background:rgba(6,9,14,.65);color:var(--text);
  font-size:13px;line-height:1.55;resize:vertical;
}
.ritual-input::placeholder{color:rgba(165,177,194,.6)}
.ritual-hints{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.ritual-timer{font-family:var(--serif);font-size:64px;letter-spacing:.04em;line-height:1;margin:20px 0 14px;color:var(--blue);font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(67,183,255,.45)}
.ritual-foot{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.ritual-link{
  display:inline-block;margin-top:18px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--border-strong);padding-bottom:3px;
}
.ritual-link:hover{color:var(--text)}

/* nuance challenge options */
.chal-opt .co-fb{display:block;margin-top:6px;font-size:10.5px;line-height:1.5;letter-spacing:0;text-transform:none;color:var(--muted)}
.chal-opt.mid{border-color:rgba(216,177,92,.6);background:rgba(216,177,92,.1)}
.chal-opt.picked{outline:2px solid rgba(241,244,249,.45);outline-offset:2px}
.chal-opt[disabled]{cursor:default}

/* countermeasure card */
.counter-panel{border-color:rgba(216,177,92,.32);background:radial-gradient(120% 130% at 100% 0%, rgba(216,177,92,.14), transparent 62%),linear-gradient(165deg,rgba(27,39,64,.92),rgba(22,33,49,.92))}
body.theme-parchment .counter-panel{background:radial-gradient(120% 130% at 100% 0%, rgba(216,177,92,.18), transparent 62%),linear-gradient(165deg,#fffdf8,#f4ecdc)}
body.theme-parchment .ritual{background:radial-gradient(70% 50% at 50% 0%, rgba(67,183,255,.18), transparent 60%),#f6f1e6}
body.theme-parchment .ritual-title{color:#121826}
body.theme-parchment .ritual-opt{background:#fffdf8;border-color:rgba(40,60,90,.18);color:#1b2230}
body.theme-parchment .ritual-input{background:#fff;color:#1b2230}


/* ============ boss mechanics ============ */
.mech-panel{margin-top:12px;padding:11px;border-radius:12px;border:1px solid rgba(229,72,72,.28);background:linear-gradient(160deg,rgba(229,72,72,.1),rgba(255,255,255,.015))}
.mech-rule{line-height:1.55;margin:4px 0 9px}
.mech-offer{margin-top:6px;padding:10px;border-radius:10px;border:1px dashed rgba(229,72,72,.55);background:rgba(229,72,72,.12)}
.mech-offer b{letter-spacing:.14em;font-size:10.5px;color:#ffb3b3}
.boss-hpbar.fogged{filter:blur(5px);opacity:.5}

.storm{position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:18px;background:rgba(6,9,14,.9);border-radius:inherit;animation:fadeIn .18s both}
.storm-card{width:100%;max-width:320px;padding:14px;border-radius:14px;border:1px solid rgba(229,72,72,.5);background:linear-gradient(160deg,#221a24,#141a28);text-align:left}
.storm-app{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.storm-text{font-size:13px;line-height:1.5;margin:6px 0 12px}

/* practice record */
.practice-strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:4px}
.p-day{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.07)}
.p-day.on{background:linear-gradient(180deg,#55D69A,#2f9c70);box-shadow:0 0 8px -2px rgba(85,214,154,.9)}

.qc-purpose{font-size:10px;color:var(--gold);letter-spacing:.02em;margin-top:2px;display:flex;gap:5px;align-items:center}
.qc-purpose svg{width:11px;height:11px}

/* world state */
.world-state{margin-bottom:12px}
.map-wrap.corr-high{box-shadow:inset 0 0 90px -30px rgba(229,72,72,.5)}
.map-wrap.corr-mid{box-shadow:inset 0 0 90px -30px rgba(216,177,92,.42)}
.map-wrap.corr-low{box-shadow:inset 0 0 90px -30px rgba(85,214,154,.42)}
.tier-node.corr-hi .tier-orb{border-color:rgba(229,72,72,.5)}

/* sanctuary richness */
.sanct-grid.rich .sanct{box-shadow:inset 0 0 40px -20px rgba(216,177,92,.85)}
.sanct-grid.rich .sanct .s-art{filter:drop-shadow(0 0 7px rgba(216,177,92,.85))}

.review-panel{border-color:rgba(67,183,255,.35)}

body.theme-parchment .mech-panel{background:linear-gradient(160deg,#fdf6f2,#f4e9e2);border-color:rgba(229,72,72,.3)}
body.theme-parchment .storm{background:rgba(246,241,230,.96)}
body.theme-parchment .storm-card{background:#fffdf8}
body.theme-parchment .p-day{background:rgba(40,60,90,.12)}
body.theme-parchment .mech-offer{background:rgba(229,72,72,.08)}


/* ============ chests ============ */
.chest-row{margin-bottom:12px}
.chest-panel{border-color:rgba(216,177,92,.22)}
.chest-panel.ready{
  border-color:rgba(216,177,92,.65);
  background:radial-gradient(120% 130% at 100% 0%, rgba(216,177,92,.2), transparent 62%),linear-gradient(165deg,rgba(27,39,64,.94),rgba(22,33,49,.94));
  box-shadow:0 0 34px -18px rgba(216,177,92,.9);
}
.chest-cards{display:grid;grid-template-columns:1fr;gap:8px}
.chest-card{
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
  padding:12px 10px;border-radius:14px;border:1px solid var(--border);
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.012));
  transition:.16s;
}
.chest-card:hover{transform:translateY(-2px);border-color:var(--border-strong)}
.chest-card .cc-ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border)}
.chest-card .cc-ico svg{width:22px;height:22px}
.chest-card .cc-rar{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.chest-card .cc-name{font-size:11.5px;font-weight:650;line-height:1.3}
.chest-card .cc-eff{font-size:10px;color:var(--muted);line-height:1.4}
.chest-card .cc-perk{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(216,177,92,.4);border-radius:999px;padding:2px 7px;margin-top:2px}
.chest-card.r-common{border-color:rgba(165,177,194,.3)}
.chest-card.r-rare{border-color:rgba(67,183,255,.4);box-shadow:inset 0 0 26px -18px rgba(67,183,255,.9)}
.chest-card.r-epic{border-color:rgba(155,112,232,.45);box-shadow:inset 0 0 30px -16px rgba(155,112,232,.95)}
.chest-card.r-legendary{border-color:rgba(216,177,92,.55);box-shadow:inset 0 0 34px -16px rgba(216,177,92,.95)}
.chest-card.r-transcendent{border-color:rgba(229,72,72,.6);box-shadow:inset 0 0 38px -14px rgba(229,72,72,.95)}
.chest-reveal{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,.03)}
.chest-reveal .cc-ico{width:60px;height:60px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--border)}
.chest-reveal .cc-ico svg{width:30px;height:30px}
.chest-reveal .cc-rar{font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.chest-reveal.r-legendary{border-color:rgba(216,177,92,.6);box-shadow:0 0 40px -20px rgba(216,177,92,.95)}
.chest-reveal.r-transcendent{border-color:rgba(229,72,72,.6);box-shadow:0 0 40px -18px rgba(229,72,72,.95)}
@media (min-width:620px){
  .chest-cards{grid-template-columns:repeat(3,1fr)}
}
body.theme-parchment .chest-panel.ready{background:radial-gradient(120% 130% at 100% 0%, rgba(216,177,92,.22), transparent 62%),linear-gradient(165deg,#fffdf8,#f4ecdc)}
body.theme-parchment .chest-card,body.theme-parchment .chest-reveal{background:linear-gradient(160deg,#fffdf8,#f4ecdc);color:#1b2230}

/* =========================================================================
   v1.4.0 — VISUAL PASS: engraved system windows, rune dividers, depth
   ========================================================================= */
:root{
  --edge: rgba(150,190,235,.20);
  --edge-strong: rgba(175,212,255,.36);
  --gold-edge: rgba(216,177,92,.42);
  --ink: #070b12;
  --sheen: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,0) 46%);
  --font-display: "Palatino Linotype", "Iowan Old Style", Palatino, "Book Antiqua", Georgia, serif;
}

/* ---------- ground: grain + vignette ---------- */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(0,0,0,.55) 100%),
    radial-gradient(90% 70% at 50% 120%, rgba(0,0,0,.5), transparent 60%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  background-size:180px 180px;mix-blend-mode:overlay;
}
body.theme-parchment::before{background:radial-gradient(120% 90% at 50% 0%, transparent 45%, rgba(120,100,70,.18) 100%)}
body.theme-parchment::after{opacity:.05}
#screens{position:relative;z-index:2}
/* fixed chrome already sits above the grain layer (z-index 60) */

/* ---------- engraved panel ---------- */
.panel{
  background:linear-gradient(180deg, rgba(30,45,71,.94), rgba(17,26,41,.96));
  border:1px solid var(--edge);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    inset 0 0 0 1px rgba(7,11,18,.55),
    inset 0 -30px 50px -40px rgba(0,0,0,.9),
    0 20px 40px -26px rgba(0,0,0,.95);
}
.panel::before{
  content:"";position:absolute;inset:5px;border-radius:calc(var(--radius) - 5px);pointer-events:none;z-index:3;
  background:
    linear-gradient(var(--gold-edge),var(--gold-edge)) left top/10px 1px no-repeat,
    linear-gradient(var(--gold-edge),var(--gold-edge)) left top/1px 10px no-repeat,
    linear-gradient(var(--gold-edge),var(--gold-edge)) right top/10px 1px no-repeat,
    linear-gradient(var(--gold-edge),var(--gold-edge)) right top/1px 10px no-repeat,
    linear-gradient(var(--gold-edge),var(--gold-edge)) left bottom/10px 1px no-repeat,
    linear-gradient(var(--gold-edge),var(--gold-edge)) left bottom/1px 10px no-repeat,
    linear-gradient(var(--gold-edge),var(--gold-edge)) right bottom/10px 1px no-repeat,
    linear-gradient(var(--gold-edge),var(--gold-edge)) right bottom/1px 10px no-repeat;
  opacity:.55;
}
.panel::after{
  background:linear-gradient(180deg, rgba(255,255,255,.06), transparent 30%);
  z-index:2;
}

/* ---------- screen heads with rune divider ---------- */
.screen-head{
  border-bottom:1px solid rgba(150,190,235,.14);
  padding-bottom:12px;position:relative;
}
.screen-head::after{
  content:"";position:absolute;left:0;bottom:-3px;width:64px;height:5px;
  background:
    linear-gradient(90deg, rgba(216,177,92,.85), rgba(216,177,92,0)) center/100% 1px no-repeat,
    radial-gradient(circle, var(--gold) 0 1.6px, transparent 2px) left center/6px 6px no-repeat;
  opacity:.9;
}
.screen-title{
  font-family:var(--font-display);
  letter-spacing:.10em;
  text-shadow:0 2px 18px rgba(67,183,255,.28), 0 1px 0 rgba(0,0,0,.6);
}
.eyebrow{
  display:flex;align-items:center;gap:7px;
}
.eyebrow::before{
  content:"";width:14px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);
}

/* ---------- bars: notched RPG gauges ---------- */
.bar{
  height:10px;border-radius:5px;
  background:linear-gradient(180deg,#05080e,#0d1622);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.9), inset 0 0 0 1px rgba(255,255,255,.05);
  overflow:hidden;
}
.bar::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,.42) 8px 9px);
  opacity:.55;
}
.bar > i{
  position:relative;
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.42), rgba(255,255,255,0) 55%),
    linear-gradient(90deg,#2b8fd6,#43B7FF);
  box-shadow:0 0 12px -2px rgba(67,183,255,.9), inset 0 1px 0 rgba(255,255,255,.5);
}
.bar.gold > i{background-image:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 55%),linear-gradient(90deg,#b78f3f,#D8B15C)}
.bar.green > i{background-image:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 55%),linear-gradient(90deg,#2f9c70,#55D69A)}
.bar.purple > i{background-image:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 55%),linear-gradient(90deg,#6d48b8,#9B70E8)}
.bar.crimson > i{background-image:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0) 55%),linear-gradient(90deg,#a92f2f,#E54848)}
.bar.xp > i{background-image:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),linear-gradient(90deg,#43B7FF,#9B70E8 60%,#D8B15C)}
.bar.xp{height:12px;border-radius:6px}
.bar-label{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}

/* ---------- buttons: beveled plates ---------- */
.btn{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#26364f,#131c2a);
  border:1px solid var(--edge-strong);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 10px 20px -14px rgba(0,0,0,.95);
  letter-spacing:.11em;
}
.btn::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--sheen);
}
.btn:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 0 22px -10px rgba(67,183,255,.85)}
.btn.primary{
  background:linear-gradient(180deg,#63cbff,#1e7cc0 70%,#16689f);
  border-color:rgba(140,220,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 0 rgba(0,0,0,.25), 0 12px 26px -14px rgba(67,183,255,.95);
  text-shadow:0 1px 0 rgba(255,255,255,.35);
}
.btn.gold{
  background:linear-gradient(180deg,#f0d38c,#c39b45 70%,#a37f31);
  border-color:rgba(255,229,170,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), 0 12px 26px -14px rgba(216,177,92,.95);
}
.btn.danger{
  background:linear-gradient(180deg,#f06868,#b52f2f 70%,#982626);
  border-color:rgba(255,160,160,.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 12px 26px -14px rgba(229,72,72,.9);
}
.btn.ghost{background:linear-gradient(180deg,rgba(38,54,79,.75),rgba(19,28,42,.85))}

/* ---------- top bar ---------- */
.topbar{
  border-bottom:1px solid rgba(150,190,235,.16);
  box-shadow:0 1px 0 rgba(255,255,255,.04), 0 14px 30px -26px rgba(0,0,0,.9);
}
.brand-rune{
  box-shadow:inset 0 0 14px -4px rgba(67,183,255,.75), 0 0 18px -10px rgba(67,183,255,.9);
}
.brand-name{
  background:linear-gradient(180deg,#F1F4F9,#9fc4e0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;
}
.cur{
  border-color:var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  letter-spacing:.04em;
}
.icon-btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

/* ---------- sidebar / bottom nav ---------- */
.side-item.active{
  box-shadow:inset 3px 0 0 var(--blue), inset 0 0 30px -14px rgba(67,183,255,.9), 0 0 18px -14px rgba(67,183,255,.9);
}
.bn-item.active svg{filter:drop-shadow(0 0 8px rgba(67,183,255,.85))}
.bn-item.active::before{height:2px;box-shadow:0 0 14px 1px rgba(67,183,255,.9)}

/* ---------- hero / avatar ---------- */
.hero{
  border-color:rgba(175,212,255,.28);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.1),
    inset 0 0 90px -40px rgba(67,183,255,.5),
    0 26px 50px -30px rgba(0,0,0,.95);
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background-image:
    repeating-linear-gradient(115deg, rgba(255,255,255,.028) 0 1px, transparent 1px 7px);
  mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
  -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,.9), transparent 70%);
}
.avatar{
  box-shadow:0 0 0 1px rgba(67,183,255,.5), 0 0 0 5px rgba(9,11,16,.85), 0 0 0 6px rgba(67,183,255,.22), 0 14px 30px -18px rgba(67,183,255,.95);
}
.avatar .lvl-badge{
  background:linear-gradient(180deg,#f2d894,#b78f3f);
  box-shadow:0 0 0 2px rgba(9,11,16,.85), 0 6px 14px -6px rgba(0,0,0,.95);
  letter-spacing:.02em;
}
.hero-name{font-family:var(--font-display);letter-spacing:.05em;text-shadow:0 2px 16px rgba(0,0,0,.7)}

/* ---------- threat / battle ---------- */
.threat{border-color:rgba(229,72,72,.38);box-shadow:inset 0 0 70px -34px rgba(229,72,72,.75), 0 20px 40px -26px rgba(0,0,0,.95)}
.threat-orb{box-shadow:0 0 26px -6px rgba(229,72,72,.95), inset 0 1px 0 rgba(255,255,255,.25)}
.battle-arena{
  box-shadow:inset 0 0 120px -50px rgba(229,72,72,.85), inset 0 1px 0 rgba(255,255,255,.06), 0 24px 46px -28px rgba(0,0,0,.95);
}
.boss-portrait{
  border-radius:50%;
  box-shadow:
    0 0 0 1px rgba(229,72,72,.55),
    0 0 0 5px rgba(9,11,16,.9),
    0 0 0 6px rgba(229,72,72,.25),
    0 0 40px -8px rgba(229,72,72,.95),
    inset 0 0 26px -10px #000;
}
.boss-portrait.phase-3,.boss-portrait.phase-4{box-shadow:0 0 0 1px rgba(229,72,72,.7),0 0 0 5px rgba(9,11,16,.9),0 0 0 6px rgba(229,72,72,.4),0 0 54px -6px rgba(229,72,72,1),inset 0 0 26px -10px #000}
.boss-hpbar{height:16px;border-radius:5px}
.boss-hpbar > i{background-image:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 55%),linear-gradient(90deg,#7d1717,#E54848 65%,#ff8a8a)}
.mech-panel{
  border-color:rgba(229,72,72,.32);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06), inset 0 0 40px -26px rgba(229,72,72,.9);
}
.skill-btn{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 8px 18px -16px rgba(0,0,0,.9);
  background:linear-gradient(160deg, rgba(67,183,255,.14), rgba(16,26,42,.9));
}
.log{background:rgba(4,7,12,.75);box-shadow:inset 0 1px 6px rgba(0,0,0,.8)}

/* ---------- items / chests: rarity treatment ---------- */
.item, .chest-card{
  background:linear-gradient(165deg, rgba(40,56,84,.55), rgba(14,22,34,.92));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07), 0 10px 22px -18px rgba(0,0,0,.95);
  overflow:hidden;position:relative;
}
.item::before, .chest-card::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(115deg, transparent 34%, rgba(255,255,255,.16) 46%, transparent 58%);
  transform:translateX(-130%);
}
.item.r-legendary::before,.item.r-transcendent::before,
.chest-card.r-legendary::before,.chest-card.r-transcendent::before{
  animation:sheen 5.5s ease-in-out infinite;
}
@keyframes sheen{
  0%,72%{transform:translateX(-130%)}
  88%,100%{transform:translateX(130%)}
}
.item.r-legendary,.chest-card.r-legendary{border-color:rgba(216,177,92,.6);box-shadow:inset 0 0 34px -16px rgba(216,177,92,.95), 0 0 20px -16px rgba(216,177,92,.9)}
.item.r-transcendent,.chest-card.r-transcendent{border-color:rgba(229,72,72,.65);box-shadow:inset 0 0 38px -14px rgba(229,72,72,.95), 0 0 22px -14px rgba(229,72,72,.9)}
.item .ico{border-radius:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -6px 12px -8px rgba(0,0,0,.9)}

/* ---------- chest ready pulse ---------- */
.chest-panel.ready{animation:readyPulse 3.4s ease-in-out infinite}
@keyframes readyPulse{
  0%,100%{box-shadow:0 0 26px -18px rgba(216,177,92,.8)}
  50%{box-shadow:0 0 42px -14px rgba(216,177,92,.95)}
}

/* ---------- quest cards ---------- */
.quest-card{background:linear-gradient(150deg, rgba(38,54,80,.6), rgba(13,20,32,.92));box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.quest-card.done{border-color:rgba(85,214,154,.4);box-shadow:inset 0 0 40px -26px rgba(85,214,154,.9)}

/* ---------- world map atmosphere ---------- */
.map-wrap{position:relative}
.map-wrap::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    radial-gradient(2px 2px at 18% 22%, rgba(255,255,255,.35), transparent 60%),
    radial-gradient(1.6px 1.6px at 72% 14%, rgba(255,255,255,.3), transparent 60%),
    radial-gradient(1.4px 1.4px at 84% 46%, rgba(255,255,255,.25), transparent 60%),
    radial-gradient(1.8px 1.8px at 30% 68%, rgba(255,255,255,.28), transparent 60%),
    radial-gradient(1.4px 1.4px at 62% 88%, rgba(255,255,255,.22), transparent 60%);
  opacity:.7;
}
.map-canvas::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(120% 80% at 50% 110%, rgba(9,11,18,.85), transparent 55%);
}
.tier-orb{box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -10px 18px -12px rgba(0,0,0,.95)}

/* ---------- sanctuary room tints ---------- */
.sanct{box-shadow:inset 0 1px 0 rgba(255,255,255,.07), inset 0 -40px 60px -50px rgba(0,0,0,.95)}
.sanct[data-room="library"]{background:radial-gradient(circle at 50% 0%, rgba(155,112,232,.22), transparent 62%),linear-gradient(170deg,#1b2340,#0a1018)}
.sanct[data-room="forge"]{background:radial-gradient(circle at 50% 0%, rgba(229,72,72,.22), transparent 62%),linear-gradient(170deg,#2a1c22,#0a1018)}
.sanct[data-room="garden"]{background:radial-gradient(circle at 50% 0%, rgba(85,214,154,.22), transparent 62%),linear-gradient(170deg,#122a22,#0a1018)}
.sanct[data-room="rest"]{background:radial-gradient(circle at 50% 0%, rgba(67,183,255,.16), transparent 62%),linear-gradient(170deg,#141f33,#0a1018)}
.sanct[data-room="trophy"]{background:radial-gradient(circle at 50% 0%, rgba(216,177,92,.24), transparent 62%),linear-gradient(170deg,#2a2416,#0a1018)}
.sanct[data-room="portal"]{background:radial-gradient(circle at 50% 0%, rgba(155,112,232,.28), transparent 62%),linear-gradient(170deg,#1d1733,#0a1018)}

/* ---------- modal ---------- */
.modal{
  box-shadow:0 -20px 70px -24px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,.1);
  border-top:1px solid rgba(175,212,255,.3);
}
.modal-title{font-family:var(--font-display);letter-spacing:.05em;text-shadow:0 2px 14px rgba(67,183,255,.25)}
.modal-grab{background:linear-gradient(90deg, transparent, rgba(216,177,92,.7), transparent)}

/* ---------- level up: rays ---------- */
.levelup::before{
  content:"";position:absolute;width:150vmax;height:150vmax;border-radius:50%;
  background:repeating-conic-gradient(from 0deg, rgba(216,177,92,.07) 0deg 4deg, transparent 4deg 20deg);
  animation:spin 60s linear infinite;
  mask-image:radial-gradient(circle, transparent 6%, rgba(0,0,0,.85) 34%, transparent 60%);
  -webkit-mask-image:radial-gradient(circle, transparent 6%, rgba(0,0,0,.85) 34%, transparent 60%);
  pointer-events:none;
}
.levelup::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 45%, rgba(6,9,14,.72) 0 22%, rgba(6,9,14,.35) 42%, transparent 62%);
}
@keyframes spin{to{transform:rotate(360deg)}}
.lu-level{font-family:var(--font-display);letter-spacing:.02em}
.lu-card{position:relative;z-index:2}

/* ---------- toast ---------- */
.toast{
  background:linear-gradient(180deg, rgba(32,47,72,.98), rgba(16,25,39,.98));
  box-shadow:0 16px 34px -18px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,.1);
}

/* ---------- scrollbar ---------- */
*::-webkit-scrollbar{width:8px;height:8px}
*::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
*::-webkit-scrollbar-thumb{background:rgba(120,160,210,.25);border-radius:8px}
*::-webkit-scrollbar-thumb:hover{background:rgba(120,160,210,.4)}

/* ---------- parchment overrides for the new layer ---------- */
body.theme-parchment .panel{background:linear-gradient(180deg,#fffdf7,#f3ecdd);box-shadow:inset 0 1px 0 #fff, 0 18px 34px -26px rgba(30,40,60,.6)}
body.theme-parchment .bar{background:linear-gradient(180deg,#ded4c0,#efe7d6);box-shadow:inset 0 1px 3px rgba(60,70,90,.25)}
body.theme-parchment .btn:not(.primary):not(.gold):not(.danger){background:linear-gradient(180deg,#fffdf7,#eee5d4);color:#1b2230;box-shadow:inset 0 1px 0 #fff,0 8px 16px -14px rgba(30,40,60,.7)}
body.theme-parchment .btn.danger{color:#fff}
body.theme-parchment .btn.gold{color:#231a06}
body.theme-parchment .btn.primary{color:#04121d}
body.theme-parchment .bar::after{opacity:.28}
body.theme-parchment .bar > i{box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
body.theme-parchment .item,body.theme-parchment .chest-card,body.theme-parchment .quest-card{background:linear-gradient(165deg,#fffdf8,#f2eada)}
body.theme-parchment .log{background:#fffdf7}
body.theme-parchment .modal{box-shadow:0 -20px 60px -30px rgba(40,50,70,.55), inset 0 1px 0 #fff}
body.theme-parchment .brand-name{background:linear-gradient(180deg,#1b2230,#3d4a60);-webkit-background-clip:text;background-clip:text}

/* ---------- v1.4.0 · round 2: depth accents ---------- */
/* hero: rune ring watermark */
.hero::after{
  content:"";position:absolute;right:-70px;top:-60px;width:300px;height:300px;border-radius:50%;
  pointer-events:none;z-index:0;
  background:
    radial-gradient(circle, transparent 58%, rgba(67,183,255,.10) 59%, transparent 60%),
    radial-gradient(circle, transparent 72%, rgba(216,177,92,.10) 73%, transparent 74%),
    conic-gradient(from 0deg, transparent 0 8deg, rgba(67,183,255,.08) 8deg 9deg, transparent 9deg 30deg);
  opacity:.9;
}

/* map: contour rings + fog */
.map-wrap::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:
    repeating-radial-gradient(circle at 50% 30%, rgba(120,160,210,.055) 0 1px, transparent 1px 46px),
    radial-gradient(60% 40% at 50% 100%, rgba(155,112,232,.12), transparent 70%);
  opacity:.85;
}

/* lift on interactive cards */
.quick, .loc, .mg-card, .boss-card, .sanct, .deco{
  transition:transform .16s ease, box-shadow .2s ease, border-color .2s ease;
}
.quick:hover, .loc:hover, .mg-card:hover, .boss-card:hover, .sanct:hover{
  transform:translateY(-2px);
  box-shadow:0 16px 28px -20px rgba(0,0,0,1), 0 0 22px -14px rgba(67,183,255,.8);
}
.quick:active, .loc:active, .mg-card:active, .sanct:active{transform:translateY(0)}

/* active nav plate */
.bn-item.active::after{
  content:"";position:absolute;top:2px;width:40px;height:34px;border-radius:12px;
  background:radial-gradient(circle at 50% 40%, rgba(67,183,255,.22), transparent 70%);
  pointer-events:none;z-index:-1;
}

/* chips: inner light */
.chip{box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.chip.gold{box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 0 16px -12px rgba(216,177,92,.9)}
.chip.blue{box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 16px -12px rgba(67,183,255,.9)}
.chip.green{box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 16px -12px rgba(85,214,154,.9)}
.chip.crimson{box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 0 16px -12px rgba(229,72,72,.9)}

/* stat tiles + dstat: engraved wells */
.tile, .dstat{
  background:linear-gradient(180deg, rgba(12,19,30,.75), rgba(20,30,46,.55));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -8px 16px -12px rgba(0,0,0,.9);
  border-color:rgba(150,190,235,.14);
}
.tile b, .dstat b{text-shadow:0 1px 12px rgba(67,183,255,.25)}

/* equipment slots */
.eq-slot{
  background:linear-gradient(180deg, rgba(10,16,26,.6), rgba(18,28,43,.45));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);
}
.eq-slot b{text-shadow:0 1px 10px rgba(0,0,0,.8)}

/* skill nodes */
.skill-node{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 10px 20px -18px rgba(0,0,0,.95);
}
.skill-node.unlocked{box-shadow:inset 0 1px 0 rgba(255,255,255,.1), inset 0 0 30px -18px rgba(85,214,154,1), 0 0 22px -16px rgba(85,214,154,.9)}
.skill-node.available{box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 22px -16px rgba(67,183,255,.9)}

/* toast accent bar */
.toast{position:relative;overflow:hidden}
.toast::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--blue),transparent)}
.toast.gold::before{background:linear-gradient(180deg,var(--gold),transparent)}
.toast.green::before{background:linear-gradient(180deg,var(--green),transparent)}
.toast.red::before{background:linear-gradient(180deg,var(--crimson),transparent)}

/* modal close button */
.modal-close{transition:.16s}
.modal-close:hover{color:var(--text);border-color:var(--edge-strong);background:rgba(255,255,255,.05)}

/* filters */
.filter{transition:.16s}
.filter:hover{border-color:var(--edge-strong);color:var(--text)}

@media (min-width:620px){
  .hero::after{width:380px;height:380px;right:-90px;top:-90px}
}

body.theme-parchment .threat .panel-title{color:#a33030!important}
body.theme-parchment .toast{background:linear-gradient(180deg,#fffdf8,#f3ecdd);color:#1b2230}
body.theme-parchment .bottomnav .bn-item{color:#5a6577}
body.theme-parchment .bn-item.active{color:#1f7fc4}
